<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlowIQ Crew Operations</title>
<meta name="theme-color" content="#020617">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at top left,rgba(37,99,235,.16),transparent 34%),#020617;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:440px;min-height:100vh;padding:24px 18px 96px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.brand{font-size:29px;font-weight:950;letter-spacing:-1px;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tagline{font-size:13px;color:#94a3b8;margin-top:4px}
.icon-box{width:48px;height:48px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:rgba(37,99,235,.20);font-size:24px}
.card,.clean-hero{background:linear-gradient(180deg,rgba(15,23,42,.96),rgba(17,24,39,.96));border:1px solid rgba(148,163,184,.12);border-radius:28px;padding:20px;margin-bottom:14px;box-shadow:0 12px 34px rgba(0,0,0,.28)}
.clean-hero{border-radius:32px}
.title{font-size:21px;font-weight:900;letter-spacing:-.4px;margin-bottom:6px}
.sub{font-size:14px;color:#94a3b8;line-height:1.45}
.section{font-size:21px;font-weight:950;margin:26px 0 12px}
button{border:0;border-radius:22px;min-height:56px;padding:0 16px;font-size:15px;font-weight:850;color:white;background:#1e293b;box-shadow:0 8px 22px rgba(0,0,0,.20)}
button:active{transform:scale(.98)}
.blue{background:#2563eb}.green{background:#059669}.red{background:#dc2626}.gray{background:#334155}.full{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lang-grid button{min-height:66px}
input,select{width:100%;min-height:54px;border-radius:18px;border:1px solid rgba(255,255,255,.08);background:rgba(15,23,42,.90);color:white;padding:0 14px;margin:8px 0 14px;font-size:15px;outline:none}
label{font-size:13px;font-weight:750;color:#cbd5e1}.hidden{display:none!important}
.status{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:900}
.wait{background:rgba(245,158,11,.16);color:#fbbf24;border:1px solid rgba(251,191,36,.22)}.ok{background:rgba(16,185,129,.18);color:#34d399;border:1px solid rgba(52,211,153,.24)}.checked{background:rgba(59,130,246,.18);color:#60a5fa;border:1px solid rgba(96,165,250,.24)}.rejected{background:rgba(239,68,68,.18);color:#f87171;border:1px solid rgba(248,113,113,.24)}
.job-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.job-title{font-size:18px;font-weight:950;line-height:1.25}
.badge{min-width:86px;min-height:38px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:linear-gradient(135deg,#2563eb,#3b82f6);font-size:13px;font-weight:950}
.info{color:#cbd5e1;font-size:14px;line-height:1.45;margin:9px 0}
.metric-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.metric{background:rgba(15,23,42,.80);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:14px 8px;text-align:center}.metric b{display:block;font-size:25px;font-weight:950}.metric span{font-size:12px;color:#94a3b8}
.worker-row{display:flex;justify-content:space-between;align-items:center;gap:10px}.worker-name{font-weight:900}.worker-meta{font-size:13px;color:#94a3b8;margin-top:4px}
.quick-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.bottom-nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:calc(100% - 24px);max-width:430px;display:none;grid-template-columns:repeat(4,1fr);gap:8px;background:rgba(15,23,42,.94);border:1px solid rgba(148,163,184,.14);border-radius:24px;padding:10px;backdrop-filter:blur(12px)}
.bottom-nav button{min-height:54px;border-radius:18px;font-size:12px;background:#020617;color:#cbd5e1;box-shadow:none}.bottom-nav button.active{background:#2563eb;color:white}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">FlowIQ Crew</div><div class="tagline">Operations · v1.0</div></div><div class="icon-box">🌐</div></header>
<section id="languageScreen"><div class="card"><div class="title">언어 선택</div><div class="sub">Choose your language.</div></div><div class="lang-grid" id="languageGrid"></div></section>
<section id="roleScreen" class="hidden"><div class="card"><div class="title">시작하기</div><div class="sub">현장 운영에 필요한 화면만 간결하게 제공합니다.</div></div><button class="full blue" onclick="selectRole('worker')">👷 근로자</button><br><br><button class="full green" onclick="selectRole('manager')">🏗️ 관리자</button><br><br><button class="full red" onclick="selectRole('master')">🛡️ MASTER</button></section>
<section id="workerInfoScreen" class="hidden"><div class="card"><div class="title">근로자 정보</div><div class="sub">처음 한 번만 입력합니다.</div></div><div class="card"><label>이름</label><input id="workerNameInput" placeholder="예: 바타르"><label>연락처</label><input id="workerPhoneInput" placeholder="예: 010-1234-5678"><button class="full blue" onclick="saveWorkerInfo()">저장 후 시작</button></div></section>
<section id="workerScreen" class="hidden"><div id="workerHome"></div><div class="section">추천 일자리</div><div id="jobsList"></div></section>
<section id="managerScreen" class="hidden"><div class="clean-hero"><div class="title">오늘 현황</div><div class="sub">공고, 지원, 출근만 빠르게 확인합니다.</div><div class="metric-wrap"><div class="metric"><b id="mJobs">0</b><span>공고</span></div><div class="metric"><b id="mApplied">0</b><span>지원</span></div><div class="metric"><b id="mChecked">0</b><span>출근</span></div></div></div><button class="full blue" onclick="goScreen('jobFormScreen')">＋ 공고 생성</button><div class="section" id="createdJobsSection">생성한 공고</div><div id="managerJobsList"></div><div class="section">지원 대기</div><div id="managerPendingList"></div><div class="section">출근 완료</div><div id="managerAttendanceList"></div></section>
<section id="jobFormScreen" class="hidden"><div class="card"><div class="title">공고 생성</div><div class="sub">필수 정보만 입력합니다.</div></div><div class="card"><label>공고명</label><input id="fTitle" placeholder="예: 성수 물류센터"><label>위치</label><input id="fLocation" placeholder="예: 서울 성동구"><label>근무 시간</label><input id="fTime" placeholder="예: 08:00 - 18:00"><label>일급</label><input id="fSalary" type="number" placeholder="예: 150000"><label>필요 인원</label><input id="fNeeded" type="number" placeholder="예: 5"><label>작업 종류</label><select id="fType"><option>물류</option><option>건설</option><option>공장</option><option>농촌</option><option>어촌</option><option>기타</option></select><button class="full blue" onclick="createJob()">공고 저장</button></div></section>
<section id="payrollScreen" class="hidden"><div class="card"><div class="title">급여</div><div class="sub">출근 완료 기준 예상 금액입니다.</div></div><div id="payrollList"></div></section>
<section id="qrScreen" class="hidden"><div class="card" style="text-align:center"><div class="title">출근</div><div class="sub">승인된 공고만 출근 처리됩니다.</div><br><button class="full green" onclick="completeCheckIn()">✅ 출근 완료</button></div></section>
<section id="masterScreen" class="hidden"><div class="clean-hero"><div class="title">MASTER</div><div class="sub">운영 데이터 확인 및 정리</div><div class="metric-wrap"><div class="metric"><b id="masterJobs">0</b><span>공고</span></div><div class="metric"><b id="masterApps">0</b><span>지원</span></div><div class="metric"><b id="masterAtt">0</b><span>출근</span></div></div></div><div class="grid2"><button class="red" onclick="masterClearApplications()">지원 삭제</button><button class="red" onclick="masterClearAttendance()">출근 삭제</button></div></section>
</div>
<nav class="bottom-nav" id="bottomNav"><button id="navHome" onclick="goHome()">홈</button><button id="navJobs" onclick="navJobs()">공고</button><button id="navCheck" onclick="showQR()">출근</button><button id="navPay" onclick="showPayroll()">급여</button></nav>
<script>
const APP_VERSION="FlowIQ Crew Operations v1.0";
const SUPABASE_URL="https://zhbzphvqiiijfjqnktlo.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpoYnpwaHZxaWlpamZqcW5rdGxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDEwNTcsImV4cCI6MjA5NDYxNzA1N30.ufIPHJh2fzRLm5taos3yTz6pGlEHFKaSoYI2Ref3T5I";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const COMPANY_PASSWORDS={demo_company:"0000",alpha:"1111",beta:"2222"};
const MASTER_PASSWORD="1234";
const languages=[{label:"🇰🇷 한국어",value:"ko"},{label:"🇺🇸 English",value:"en"},{label:"🇻🇳 Tiếng Việt",value:"vi"},{label:"🇲🇳 Монгол",value:"mn"},{label:"🇹🇭 ไทย",value:"th"},{label:"🇳🇵 नेपाली",value:"np"},{label:"🇺🇿 Oʻzbek",value:"uz"},{label:"🇨🇳 中文",value:"zh"}];
let role=localStorage.getItem("operations_role")||null,companyId=localStorage.getItem("operations_company")||"demo_company",workerName=localStorage.getItem("operations_worker_name")||"",workerPhone=localStorage.getItem("operations_worker_phone")||"",jobs=[],applications=[],attendance=[],pendingApplications=[],currentScreen="languageScreen";
const screens=["languageScreen","roleScreen","workerInfoScreen","workerScreen","managerScreen","jobFormScreen","payrollScreen","qrScreen","masterScreen"];
function won(n){return Number(n||0).toLocaleString("ko-KR")+"원"}
function show(id){currentScreen=id;screens.forEach(s=>{const el=document.getElementById(s);if(el)el.classList.add("hidden")});document.getElementById(id).classList.remove("hidden");bottomNav.style.display=["workerScreen","managerScreen","payrollScreen","qrScreen"].includes(id)?"grid":"none";updateNav()}
function goScreen(id){show(id)}
function selectLanguage(lang){localStorage.setItem("operations_lang",lang);show("roleScreen")}
async function selectRole(selected){if(selected==="worker"){role="worker";localStorage.setItem("operations_role","worker");if(!workerName||!workerPhone){show("workerInfoScreen");return}await loadData();show("workerScreen")}if(selected==="manager"){const code=prompt("업체 코드");if(!code||!COMPANY_PASSWORDS[code])return alert("업체 코드를 확인하세요.");const pw=prompt("비밀번호");if(pw!==COMPANY_PASSWORDS[code])return alert("비밀번호가 틀렸습니다.");role="manager";companyId=code;localStorage.setItem("operations_role","manager");localStorage.setItem("operations_company",code);await loadData();show("managerScreen")}if(selected==="master"){const pw=prompt("MASTER 비밀번호");if(pw!==MASTER_PASSWORD)return alert("비밀번호가 틀렸습니다.");role="master";localStorage.setItem("operations_role","master");await loadData();show("masterScreen")}}
function saveWorkerInfo(){const name=workerNameInput.value.trim(),phone=workerPhoneInput.value.trim();if(!name||!phone)return alert("이름과 연락처를 입력하세요.");workerName=name;workerPhone=phone;localStorage.setItem("operations_worker_name",name);localStorage.setItem("operations_worker_phone",phone);loadData().then(()=>show("workerScreen"))}
async function loadData(){let jobsQuery=db.from("jobs").select("*"),appsQuery=db.from("applications").select("*"),attQuery=db.from("attendance").select("*");if(role==="manager"){jobsQuery=jobsQuery.eq("company_id",companyId);appsQuery=appsQuery.eq("company_id",companyId);attQuery=attQuery.eq("company_id",companyId)}if(role==="worker"&&workerPhone){appsQuery=appsQuery.eq("phone",workerPhone);attQuery=attQuery.eq("phone",workerPhone)}const jr=await jobsQuery.order("created_at",{ascending:false}),ar=await appsQuery.order("created_at",{ascending:false}),tr=await attQuery.order("created_at",{ascending:false});if(jr.error)return alert("공고 오류: "+jr.error.message);if(ar.error)return alert("지원 오류: "+ar.error.message);if(tr.error)return alert("출근 오류: "+tr.error.message);jobs=jr.data||[];applications=ar.data||[];attendance=tr.data||[];renderAll()}
function renderAll(){renderWorkerHome();renderJobs();renderManager();renderPayroll();renderMaster()}
function getMyApp(){return applications.find(a=>a.phone===workerPhone)||null}
function renderWorkerHome(){const el=document.getElementById("workerHome");if(!el)return;const app=getMyApp();const status=app?(app.status||"지원"):"근무 가능";const job=app?jobs.find(j=>Number(j.id)===Number(app.job_id)):null;const statusClass=status==="승인"?"ok":status==="출근완료"?"checked":status==="거절"?"rejected":"wait";const statusText=status==="지원"?"승인 대기중":status==="승인"?"승인 완료":status==="출근완료"?"출근 완료":status;el.innerHTML=`<div class="clean-hero"><span class="status ${statusClass}">${statusText}</span><div class="title" style="margin-top:12px">${job?job.title:"오늘 현장 없음"}</div><div class="sub">${job?job.location:"지원 후 승인되면 현장이 표시됩니다."}</div>${job?`<div class="info">🕒 ${job.work_time}</div><div class="info">💰 ${won(job.salary)}</div>`:""}<div class="quick-row"><button class="blue" onclick="openMap('${job?String(job.location).replace(/'/g,"\'"):""}')">길찾기</button><button class="green" onclick="showQR()">출근</button></div></div>`}
function renderJobs(){const el=document.getElementById("jobsList");if(!el)return;el.innerHTML=jobs.length?jobs.map(j=>{const already=applications.some(a=>Number(a.job_id)===Number(j.id)&&a.phone===workerPhone);return `<div class="card"><div class="job-head"><div><div class="job-title">${j.title}</div><div class="sub">${j.type||"현장"}</div></div><div class="badge">${won(j.salary)}</div></div><div class="info">📍 ${j.location}</div><div class="info">🕒 ${j.work_time}</div><button class="full ${already?'gray':'blue'}" onclick="applyJob(${j.id})">${already?'지원 완료':'지원하기'}</button></div>`}).join(""):`<div class="card"><div class="sub">현재 공고가 없습니다.</div></div>`}
async function applyJob(jobId){if(!workerName||!workerPhone)return show("workerInfoScreen");if(applications.some(a=>a.phone===workerPhone))return alert("이미 지원한 공고가 있습니다.");const job=jobs.find(j=>Number(j.id)===Number(jobId));if(!job)return alert("공고를 찾을 수 없습니다.");const {error}=await db.from("applications").insert({job_id:jobId,worker_name:workerName,phone:workerPhone,company_id:job.company_id,status:"지원"});if(error)return alert("지원 오류: "+error.message);await db.from("jobs").update({applied:(job.applied||0)+1}).eq("id",jobId);await loadData();alert("지원 완료")}
function renderManager(){const jobEl=document.getElementById("managerJobsList"),pendEl=document.getElementById("managerPendingList"),attEl=document.getElementById("managerAttendanceList");if(!jobEl||!pendEl||!attEl)return;const waiting=applications.filter(a=>(a.status||"지원")==="지원");pendingApplications=waiting;mJobs.innerText=jobs.length;mApplied.innerText=waiting.length;mChecked.innerText=attendance.length;jobEl.innerHTML=jobs.length?jobs.map(j=>`<div class="card"><div class="job-head"><div><div class="job-title">${j.title}</div><div class="sub">${j.location}</div></div><div class="badge">${won(j.salary)}</div></div><div class="info">🕒 ${j.work_time}</div><div class="info">👥 ${(j.applied||0)}/${j.needed||0}</div></div>`).join(""):`<div class="card"><div class="sub">생성한 공고가 없습니다.</div></div>`;pendEl.innerHTML=waiting.length?waiting.map((a,i)=>{const job=jobs.find(j=>Number(j.id)===Number(a.job_id));return `<div class="card"><div class="worker-row"><div><div class="worker-name">${a.worker_name||"이름없음"}</div><div class="worker-meta">${a.phone||""} · ${job?job.title:"공고 없음"}</div></div><div style="display:flex;flex-direction:column;gap:8px"><button class="green" onclick="changeStatus(${i},'승인')">승인</button><button class="red" onclick="changeStatus(${i},'거절')">거절</button></div></div></div>`}).join(""):`<div class="card"><div class="sub">지원 대기자가 없습니다.</div></div>`;attEl.innerHTML=attendance.length?attendance.map(a=>`<div class="card"><div class="worker-row"><div><div class="worker-name">${a.worker_name||"이름없음"}</div><div class="worker-meta">${a.job_title||""}</div></div><span class="status checked">출근 완료</span></div></div>`).join(""):`<div class="card"><div class="sub">출근 기록이 없습니다.</div></div>`}
async function changeStatus(index,status){const app=pendingApplications[index];if(!app)return alert("지원 기록을 찾을 수 없습니다.");const {error}=await db.from("applications").update({status}).eq("id",app.id);if(error)return alert("상태 변경 오류: "+error.message);await loadData();alert(status+" 완료")}
async function createJob(){const title=fTitle.value.trim(),location=fLocation.value.trim(),work_time=fTime.value.trim(),salary=Number(fSalary.value||0),needed=Number(fNeeded.value||0),type=fType.value;if(!title||!location||!work_time||!salary||!needed)return alert("필수 정보를 입력하세요.");const {error}=await db.from("jobs").insert({title,location,work_time,salary,needed,type,applied:0,language:"한국어",company_id:companyId});if(error)return alert("공고 저장 오류: "+error.message);fTitle.value=fLocation.value=fTime.value=fSalary.value=fNeeded.value="";await loadData();show("managerScreen");setTimeout(()=>document.getElementById("createdJobsSection").scrollIntoView({behavior:"smooth"}),100)}
function openMap(locationText){if(!locationText)return alert("현장 위치가 없습니다.");window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(locationText)}`,"_blank")}
function showQR(){show("qrScreen")}
async function completeCheckIn(){const app=applications.find(a=>(a.status||"지원")==="승인");if(!app)return alert("승인된 공고만 출근할 수 있습니다.");const job=jobs.find(j=>Number(j.id)===Number(app.job_id));if(!job)return alert("공고를 찾을 수 없습니다.");const {error}=await db.from("attendance").insert({job_id:job.id,worker_name:workerName,phone:workerPhone,job_title:job.title,amount:job.salary,company_id:job.company_id,gps:"manual"});if(error)return alert("출근 오류: "+error.message);await db.from("applications").update({status:"출근완료"}).eq("id",app.id);await loadData();alert("출근 완료");goHome()}
function showPayroll(){show("payrollScreen")}
function renderPayroll(){const el=document.getElementById("payrollList");if(!el)return;const total=attendance.reduce((s,a)=>s+Number(a.amount||0),0);el.innerHTML=attendance.length?`<div class="card"><div class="title">${won(total)}</div><div class="sub">누적 예상 급여</div></div>`:`<div class="card"><div class="sub">아직 급여 기록이 없습니다.</div></div>`}
function renderMaster(){if(!document.getElementById("masterJobs"))return;masterJobs.innerText=jobs.length;masterApps.innerText=applications.length;masterAtt.innerText=attendance.length}
async function masterClearApplications(){if(role!=="master")return;if(!confirm("지원 기록 전체 삭제?"))return;const {error}=await db.from("applications").delete().neq("id",-1);if(error)return alert(error.message);await loadData()}
async function masterClearAttendance(){if(role!=="master")return;if(!confirm("출근 기록 전체 삭제?"))return;const {error}=await db.from("attendance").delete().neq("id",-1);if(error)return alert(error.message);await loadData()}
function goHome(){if(role==="manager")show("managerScreen");else if(role==="master")show("masterScreen");else show("workerScreen")}
function navJobs(){if(role==="manager"){show("managerScreen");setTimeout(()=>document.getElementById("createdJobsSection").scrollIntoView({behavior:"smooth"}),100)}else if(role==="worker")show("workerScreen");else show("masterScreen")}
function updateNav(){["navHome","navJobs","navCheck","navPay"].forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove("active")});if(["workerScreen","managerScreen","masterScreen"].includes(currentScreen))navHome.classList.add("active");if(currentScreen==="payrollScreen")navPay.classList.add("active");if(currentScreen==="qrScreen")navCheck.classList.add("active")}
function init(){languageGrid.innerHTML=languages.map(l=>`<button onclick="selectLanguage('${l.value}')">${l.label}</button>`).join("");const lang=localStorage.getItem("operations_lang");if(!lang)show("languageScreen");else if(role==="manager")loadData().then(()=>show("managerScreen"));else if(role==="worker"){if(workerName&&workerPhone)loadData().then(()=>show("workerScreen"));else show("workerInfoScreen")}else if(role==="master")loadData().then(()=>show("masterScreen"));else show("roleScreen")}
init();
</script>
</body>
</html>

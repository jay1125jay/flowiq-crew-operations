async function live(){

    const isNew=[...after].some(k=>!before.has(k));
    lastPendingJobs=after; render();

function companyStats(companyId){
  const cid=String(companyId||'');
  const companyJobs=jobs.filter(j=>String(j.company_id||'')===cid);
  const jobIds=new Set(companyJobs.map(j=>Number(j.id)));
  const companyApps=applications.filter(a=>jobIds.has(Number(a.job_id)) || String(a.company_id||'')===cid);
  const matchedJobIds=new Set(companyApps.filter(a=>['승인','근무완료'].includes(clean(a.status))).map(a=>Number(a.job_id)));
  const completedJobIds=new Set(companyApps.filter(a=>clean(a.status)==='근무완료').map(a=>Number(a.job_id)));
  return {jobs:companyJobs.length, match:matchedJobIds.size, done:completedJobIds.size};
}

/* ===== FlowIQ Crew MASTER v4.1.16 Master Action Row ===== */
async function deleteJob(id){
  const jobId = Number(id);
  const j = jobs.find(x=>Number(x.id)===jobId);
  const title = j ? clean(j.title) : '선택한 공고';
  if(!confirm(`공고를 삭제할까요?\n\n${title}\n\n연결된 신청 기록도 함께 삭제됩니다.`)) return;
  try{
    const appRes = await db.from('applications').delete().eq('job_id', jobId);
    if(appRes.error) return alert('신청 기록 삭제 오류: ' + appRes.error.message);
    const jobRes = await db.from('jobs').delete().eq('id', jobId);
    if(jobRes.error) return alert('공고 삭제 오류: ' + jobRes.error.message);
    toast('공고가 삭제되었습니다.');
    await refresh();
  }catch(e){
    alert('공고 삭제 중 오류가 발생했습니다: ' + (e && e.message ? e.message : e));
  }
}

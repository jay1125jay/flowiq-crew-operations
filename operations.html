/* ===== WEXA neon button system ===== */
:root{
  --wexa-blue:#2563ff;

button{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  border:1px solid rgba(37,99,255,.38) !important;
  color:#f8fbff !important;
  background:linear-gradient(180deg,rgba(13,17,32,.92),rgba(4,9,22,.96)) !important;

  min-height:50px;
  font-weight:950 !important;

    transform .30s cubic-bezier(.22,.61,.36,1),
    filter .30s cubic-bezier(.22,.61,.36,1),
    opacity .30s cubic-bezier(.22,.61,.36,1);
}
#wexaAppSplash.wexa-splash-hide .wexa-splash-card img{
  transform:scale(1.018);
  filter:brightness(1.04) blur(.6px);
}
#wexaAppSplash.wexa-splash-hide .wexa-splash-text{
  opacity:0;
  transform:translateY(4px);
  transition:opacity .22s ease, transform .22s ease;
}
body.wexa-splash-active .app{
  opacity:0;
  transform:translateY(8px) scale(.992);
  filter:blur(1.5px);
}
body.wexa-splash-ready .app{
  opacity:1;
  transform:translateY(0) scale(1);
  filter:blur(0);
  animation:wexaAppAfterSplashIn .36s cubic-bezier(.22,.61,.36,1) both;
}
@media (min-width:600px){
  #wexaAppSplash{
    align-items:center;
    justify-content:center;
    padding:0;
  }

@media (max-width:599px){

@media (prefers-reduced-motion:reduce){

    animation:none!important;
  }

    transition:none!important;
  }
}
@keyframes wexaSplashFinalIn{
  0%{opacity:0;transform:scale(1.018);filter:brightness(.78) blur(2px)}

}

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#061019">
<link rel="manifest" href="./manifest.webmanifest">
<title>RACE SPORTS</title>
<style>
:root{--bg:#061019;--panel:#0b1722;--line:#1c3042;--text:#f6f8fb;--muted:#8092a7;--green:#3ce6a2;--amber:#ffd276;--red:#ff6b74;--blue:#6594ff;--gold:#ffd66b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}body{min-height:100vh;padding-bottom:76px;background:radial-gradient(circle at 12% -8%,rgba(60,230,162,.08),transparent 30%),linear-gradient(180deg,#061019,#07131d)}button{font:inherit}
.top{position:sticky;top:0;z-index:50;background:rgba(6,16,25,.965);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:9px 10px 7px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{display:flex;align-items:center;gap:9px}.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:1000;color:#06110c;background:linear-gradient(145deg,#3ce6a2,#6594ff)}.title{font-size:13px;font-weight:950;letter-spacing:.08em}.sub{font-size:8px;color:var(--muted);margin-top:2px}.fresh{font-size:9px;color:#b5f5d5;border:1px solid #2a5b46;background:#10261d;border-radius:999px;padding:6px 8px;white-space:nowrap}.sports{display:flex;gap:5px;overflow-x:auto;padding-top:8px;scrollbar-width:none}.sports::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:1px solid var(--line);background:#09141e;color:var(--muted);padding:6px 10px;border-radius:999px;font-size:10px;font-weight:850}.chip.active{color:#eafff3;background:#153127;border-color:#326d54}
main{padding:9px;max-width:720px;margin:0 auto}.dash{border:1px solid var(--line);background:linear-gradient(145deg,#0d1b27,#09141e);border-radius:14px;padding:10px}.dashTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.ey{font-size:8px;color:var(--green);font-weight:900;letter-spacing:.14em}.hero{font-size:20px;font-weight:950;margin-top:4px}.date{font-size:10px;color:var(--muted);padding-top:4px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.metric{background:#07111a;border:1px solid #173048;border-radius:9px;padding:7px}.metric small{display:block;font-size:8px;color:var(--muted)}.metric b{font-size:14px}.sources{display:flex;gap:5px;overflow-x:auto;margin:8px 0;scrollbar-width:none}.src{flex:0 0 auto;border:1px solid #2c5d47;border-radius:8px;padding:5px 7px;font-size:8px;color:#aef0cf;background:#0c1b15}.src.bad{border-color:#633236;color:#ffb0b5;background:#241214}.notice{display:flex;justify-content:space-between;gap:7px;margin-bottom:8px;padding:7px 9px;border:1px solid #162a3b;border-radius:9px;background:#08131d;color:#7f91a5;font-size:8px}.notice b{color:#c3cfda}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}.filter{border:1px solid var(--line);background:#09141e;color:var(--muted);border-radius:9px;padding:7px 3px;font-size:9px;font-weight:850}.filter.active{color:#eafff3;background:#153127;border-color:#326d54}.section{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 6px}.section h2{font-size:14px;margin:0}.section span{font-size:9px;color:var(--muted)}
.event{background:linear-gradient(180deg,#0c1924,#08131c);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:8px;box-shadow:0 8px 18px rgba(0,0,0,.1)}.head{display:grid;grid-template-columns:54px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid #162a3a}.time{font-size:16px;font-weight:950}.league{font-size:11px;font-weight:900}.meta{font-size:8px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:8px;font-weight:900;padding:5px 6px;border:1px solid #28543f;border-radius:7px;color:#b5f6d4;background:#10251c}.status.live{border-color:#6d3338;color:#ffb4b9;background:#331a1c}.status.final{border-color:#70602a;color:#ffe59b;background:#2b2510}.raceH,.raceR{display:grid;grid-template-columns:minmax(0,1fr) 62px 84px 50px;gap:5px;align-items:center}.raceH{padding:6px 10px;font-size:8px;color:#718397}.raceR{padding:7px 9px;border-top:1px solid #13283a;min-height:46px}.runner{font-size:11px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.center,.rev{text-align:right;font-size:8px;color:#718397}.rank{display:inline-grid;place-items:center;min-width:24px;height:23px;border-radius:7px;border:1px solid #2b4259;background:#0d1924;color:#c7d2dd;font-size:9px;font-weight:900}.rank.r1{color:#1a1600;background:#f1cc5f;border-color:#f1cc5f}.rank.r2{color:#0d1620;background:#c8d1db;border-color:#c8d1db}.rank.r3{color:#201306;background:#c99055;border-color:#c99055}.autoOdds{height:31px;border:1px solid #2b4259;background:#0d1924;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}.autoOdds.wait{color:#617489;font-size:9px;font-weight:800}.autoOdds.live{border-color:#356d55;background:#10251c;color:#c7f7df}.sourceTag{display:block;margin-top:2px;font-size:7px;color:#6f8295;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.good{color:var(--green)!important;font-weight:900}.warn{color:var(--amber)!important;font-weight:900}.badEv{color:#ff8a92!important;font-weight:900}.match{padding:9px 10px;display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:center}.side small{display:block;font-size:8px;color:var(--muted);margin-bottom:2px}.side b{font-size:14px}.right{text-align:right}.vs{font-size:8px;color:#607184;font-weight:900}.markets{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:0 8px 8px}.market{border:1px solid #21364a;background:#07111a;border-radius:9px;padding:6px}.mt{display:flex;justify-content:space-between;gap:3px;font-size:9px;color:var(--muted)}.prob{font-size:12px;font-weight:900;color:#eef3f8}.marketOdds{height:31px;margin-top:5px;border:1px solid #2b4259;background:#0d1924;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}.marketOdds.wait{color:#617489;font-size:9px}.mf{display:flex;justify-content:space-between;gap:3px;font-size:8px;color:#687a8e;margin-top:4px}.foot{display:flex;justify-content:space-between;border-top:1px solid #162a3a;padding:6px 10px;font-size:8px;color:var(--muted)}
.resultBox{padding:9px;border-bottom:1px solid #162a3a;background:linear-gradient(135deg,#101d27,#0a151e)}.resultTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.resultTitle b{font-size:10px;color:#ffe39a}.resultTitle span{font-size:8px;color:var(--muted)}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.pod{border:1px solid #273b4e;background:#08131c;border-radius:9px;padding:7px;text-align:center}.pod .rk{font-size:8px;color:var(--muted)}.pod .no{font-size:16px;font-weight:950;margin-top:1px}.pod .nm{font-size:9px;font-weight:850;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pod.first{border-color:#7e6a2a;background:#1d190a}.pod.first .no{color:#ffe18a}.payouts{display:flex;gap:5px;overflow-x:auto;margin-top:7px;scrollbar-width:none}.payout{flex:0 0 auto;border:1px solid #2b4259;background:#09141e;border-radius:8px;padding:6px 8px}.payout .m{font-size:7px;color:#7f91a5}.payout .v{font-size:10px;font-weight:900;margin-top:1px}.payout .w{font-size:7px;color:#9eafbf;margin-top:1px}.empty{padding:30px 18px;text-align:center;color:var(--muted);border:1px solid var(--line);border-radius:14px;background:#0b1520}.empty b{display:block;color:#dce5ed;margin-bottom:5px}.bottom{position:fixed;left:8px;right:8px;bottom:8px;z-index:60;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(9,17,26,.98);backdrop-filter:blur(16px);border:1px solid #293c4f;border-radius:14px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.35)}.bottom button{border:0;background:transparent;color:#78899c;padding:10px 2px;font-size:9px;font-weight:850}.bottom button:first-child{color:var(--green);background:rgba(60,230,162,.07)}
</style>
</head>
<body>
<header class="top"><div class="toprow"><div class="brand"><div class="logo">RS</div><div><div class="title">RACE SPORTS</div><div class="sub">OFFICIAL DATA · AUTO ODDS · RESULTS</div></div></div><div class="fresh" id="fresh">연결중</div></div><div class="sports" id="sports"></div></header>
<main><section class="dash"><div class="dashTop"><div><div class="ey">TODAY / KST</div><div class="hero" id="hero">전체 종목</div></div><div class="date" id="date"></div></div><div class="metrics"><div class="metric"><small>오늘 경기</small><b id="cnt">0</b></div><div class="metric"><small>LIVE</small><b id="live">0</b></div><div class="metric"><small>확정</small><b id="finalCnt">0</b></div><div class="metric"><small>VALUE</small><b id="val">0</b></div></div></section><div class="sources" id="sources"></div><div class="notice"><span>당일 경기 <b>끝까지 표시</b></span><span>결과 <b>5분 자동수집</b></span><span>과거 <b>DB 저장</b></span></div><div class="filters"><button class="filter active" data-f="ALL" onclick="setFilter('ALL')">전체</button><button class="filter" data-f="OPEN" onclick="setFilter('OPEN')">예정·LIVE</button><button class="filter" data-f="FINAL" onclick="setFilter('FINAL')">결과확정</button></div><div class="section"><h2>오늘 경기</h2><span id="count">0경기</span></div><div id="events"></div></main>
<nav class="bottom"><button>오늘</button><button>VALUE</button><button>분석</button><button>설정</button></nav>
<script>
const API='https://sljviokftrlvqtabmmgm.supabase.co/functions/v1/race-sports-api';
const SPORTS=[['ALL','전체'],['HORSE','경마'],['CYCLE','경륜'],['BOAT','경정'],['BULL','소싸움'],['SOCCER','축구'],['BASEBALL','야구'],['BASKETBALL','농구'],['VOLLEYBALL','배구'],['ICE_HOCKEY','아이스하키'],['AMERICAN_FOOTBALL','미식축구'],['TENNIS','테니스'],['TABLE_TENNIS','탁구'],['HANDBALL','핸드볼'],['RUGBY','럭비'],['CRICKET','크리켓'],['FUTSAL','풋살'],['MMA','MMA'],['BOXING','복싱'],['GOLF','골프'],['MOTORSPORT','모터스포츠']];
const N=Object.fromEntries(SPORTS);let rows=[],sport='ALL',filter='ALL';
sports.innerHTML=SPORTS.map((x,i)=>`<button class="chip ${i===0?'active':''}" data-code="${x[0]}" onclick="sel('${x[0]}')">${x[1]}</button>`).join('');
function num(v){const x=Number(v);return Number.isFinite(x)&&x>0?x:null}function ev(p,o){return p&&o?p*o-1:null}function evClass(x){return x===null?'':x>=.05?'good':x>0?'warn':'badEv'}function evText(x){return x===null?'—':`${x>=0?'+':''}${(x*100).toFixed(1)}%`}function pct(p){return p?`${(p*100).toFixed(1)}%`:'분석대기'}function oddsText(d){return d?d.toFixed(1):'수집대기'}function sourceText(o){if(o.odds_source==='KBOAT_FINAL_SINGLE_AUTO')return'KBOAT 단승';return o.odds_source||'자동대기'}
function statusText(e){return e.status==='FINAL'?'확정':e.status==='LIVE'?'LIVE':'예정'}function statusClass(e){return e.status==='FINAL'?'final':e.status==='LIVE'?'live':''}
function resultBox(e){if(!e.result||!Array.isArray(e.result.top3))return'';const p=e.result.top3;const pods=p.map((x,i)=>`<div class="pod ${i===0?'first':''}"><div class="rk">${x.rank}위</div><div class="no">${x.number}</div><div class="nm">${x.name}</div></div>`).join('');const pays=(e.result.markets||[]).filter((x,i,a)=>i===0||x.market!=='연승식').map(x=>`<div class="payout"><div class="m">${x.market}</div><div class="v">${Number(x.odds).toFixed(1)}배</div><div class="w">${x.winner}</div></div>`).join('');const t=e.result.updated_at?new Date(e.result.updated_at).toLocaleTimeString('ko-KR',{hour12:false,hour:'2-digit',minute:'2-digit'}):'';return `<div class="resultBox"><div class="resultTitle"><b>공식 결과 확정</b><span>${t} 갱신</span></div><div class="podium">${pods}</div><div class="payouts">${pays}</div></div>`}
function market(e,o){const p=num(o.model_p),d=num(o.odds),x=ev(p,d);return `<div class="market"><div class="mt"><span>${o.name}</span><span class="prob">${pct(p)}</span></div><div class="marketOdds ${d?'':'wait'}">${oddsText(d)}</div><div class="mf"><span>${sourceText(o)}</span><span class="${evClass(x)}">EV ${evText(x)}</span></div></div>`}
function raceRow(e,o){const p=num(o.model_p),d=num(o.odds),x=ev(p,d),r=Number(o.final_rank||0);if(e.status==='FINAL')return `<div class="raceR"><div class="runner">${o.name}</div><div class="center"><span class="rank ${r?`r${r}`:''}">${r?r+'위':'-'}</span></div><div class="center">${r===1?'승자':r?'입상':'-'}</div><div class="rev">${r||'-'}</div></div>`;return `<div class="raceR"><div class="runner">${o.name}</div><div class="center">${pct(p)}</div><div><div class="autoOdds ${d?'live':'wait'}">${oddsText(d)}</div><span class="sourceTag">${sourceText(o)}</span></div><div class="rev ${evClass(x)}">${evText(x)}</div></div>`}
function card(e){const h=`<div class="head"><div class="time">${e.start_time||'--:--'}</div><div><div class="league">${e.competition||N[e.sport]||e.sport}</div><div class="meta">${e.title||e.id} · ${e.provider||'-'}</div></div><div class="status ${statusClass(e)}">${statusText(e)}</div></div>`;if(e.market_type==='THREE_WAY')return `<article class="event">${h}${resultBox(e)}<div class="match"><div class="side"><small>${e.left_tag||''}</small><b>${e.left||''}</b></div><div class="vs">VS</div><div class="side right"><small>${e.right_tag||''}</small><b>${e.right||''}</b></div></div><div class="markets">${e.outcomes.map(o=>market(e,o)).join('')}</div><div class="foot"><span>${e.status==='FINAL'?'공식 결과 보존':'자동배당 전용'}</span><span>${e.sport==='BULL'?'홍 · 무 · 청':'공식 승식'}</span></div></article>`;const label=e.status==='FINAL'?'착순':e.sport==='BOAT'?'단승 자동배당':'자동배당';return `<article class="event">${h}${resultBox(e)}<div class="raceH"><span>출전</span><span style="text-align:right">${e.status==='FINAL'?'착순':'모델'}</span><span style="text-align:center">${label}</span><span style="text-align:right">${e.status==='FINAL'?'결과':'EV'}</span></div>${e.outcomes.map(o=>raceRow(e,o)).join('')}<div class="foot"><span>${e.status==='FINAL'?'공식 결과':'공식 출전표'}</span><span>${e.status==='FINAL'?'당일 화면 유지':e.sport==='BOAT'?'KBOAT 배당 자동수집':'공식배당 연동대기'}</span></div></article>`}
function visible(e){if(sport!=='ALL'&&e.sport!==sport)return false;if(filter==='FINAL'&&e.status!=='FINAL')return false;if(filter==='OPEN'&&e.status==='FINAL')return false;return true}
function render(){const scoped=rows.filter(e=>sport==='ALL'||e.sport===sport),a=rows.filter(visible);events.innerHTML=a.length?a.map(card).join(''):`<div class="empty"><b>표시할 경기가 없습니다.</b>오늘 공식 데이터 기준으로 자동 갱신됩니다.</div>`;cnt.textContent=scoped.length;live.textContent=scoped.filter(e=>e.status==='LIVE').length;finalCnt.textContent=scoped.filter(e=>e.status==='FINAL').length;let values=0;scoped.forEach(e=>e.outcomes.forEach(o=>{const x=ev(num(o.model_p),num(o.odds));if(x!==null&&x>=.05)values++}));val.textContent=values;count.textContent=`${a.length}경기`;hero.textContent=`${sport==='ALL'?'전체':N[sport]} 종목`}
function sel(c){sport=c;document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.dataset.code===c));render()}function setFilter(f){filter=f;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.f===f));render()}
async function load(){try{const r=await fetch(API+'?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();rows=j.events||[];date.textContent=j.date_display||j.date||'';sources.innerHTML=(j.providers||[]).map(s=>`<div class="src ${s.status==='PASS'?'':'bad'}">${s.provider} · ${s.status}</div>`).join('');fresh.textContent=`● ${j.time||''} 갱신`;render()}catch(e){fresh.textContent='업데이트 오류';events.innerHTML=`<div class="empty"><b>데이터 연결 오류</b>${String(e.message||e)}</div>`}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});load();setInterval(load,10000);
</script>
</body></html>

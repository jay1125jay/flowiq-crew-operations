<script>
const RACING=[['ALL','전체'],['HORSE','경마'],['CYCLE','경륜'],['BOAT','경정'],['BULL','소싸움']];
const SPORTS=[['ALL','전체'],['SOCCER','축구'],['BASEBALL','야구'],['BASKETBALL','농구'],['VOLLEYBALL','배구']];
let racingPaper=null;
const LABEL=Object.fromEntries([...RACING,...SPORTS]);let racingData={events:[],providers:[]},sportsData={events:[],providers:[]},data=racingData,domain='RACING',sp='ALL',view='TODAY';
const $=id=>document.getElementById(id),tabs=$('tabs'),content=$('content'),badge=$('badge'),notice=$('notice'),refreshBtn=$('refreshBtn');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

renderTabs();
refreshBtn?.addEventListener('click',async()=>{if(refreshBtn.disabled)return;const old=refreshBtn.textContent;refreshBtn.disabled=true;refreshBtn.textContent='↻ 갱신중';try{await load()}finally{refreshBtn.textContent=old;refreshBtn.disabled=false}});
document.querySelector('.domains').addEventListener('click',e=>{const b=e.target.closest('button[data-domain]');if(!b)return;domain=b.dataset.domain;data=domain==='RACING'?racingData:sportsData;document.querySelectorAll('.domainBtn').forEach(x=>x.classList.toggle('on',x===b));renderTabs();render()});
tabs.addEventListener('click',e=>{const b=e.target.closest('button[data-sport]');if(!b)return;sp=b.dataset.sport;tabs.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render()});
document.querySelector('.bottom').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(!b)return;view=b.dataset.view;document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('on',x===b));render()});
function scoped(){return (data.events||[]).filter(e=>sp==='ALL'||e.sport===sp)}
function fresh(e){return !e.stale&&e.data_state!=='STALE_LAST_KNOWN_GOOD'}
function providerStatus(name){return (data.providers||[]).find(x=>x.provider===name)?.status||null}
function modelFresh(e){if(!(e.outcomes||[]).some(o=>Number(o.model_p)>0))return true;if(e.sport==='BOAT'&&String(e.model_source||'').startsWith('boat_'))return ['PROVISIONAL','PASS'].includes(providerStatus('BOAT_OWN_MODEL'));if(e.sport==='CYCLE'&&String(e.model_source||'').startsWith('cycle_'))return ['PROVISIONAL','PASS'].includes(providerStatus('CYCLE_OWN_MODEL'));if(e.sport==='BOAT')return providerStatus('BOAT_AI_KBOAT')==='PASS'&&!e.model_stale;if(e.sport==='CYCLE')return providerStatus('CYCLE_AI_KCYCLE')==='PASS';if(e.sport==='BULL')return providerStatus('BULL_MODEL_V130')==='PASS';if(e.sport==='HORSE')return ['PROVISIONAL','PASS'].includes(providerStatus('HORSE_MODEL'));return true}
function valueModelReady(e){if(e.sport==='HORSE')return e.model_validated===true&&providerStatus('HORSE_MODEL')==='PASS';if(e.sport==='CYCLE'&&String(e.model_source||'').startsWith('cycle_'))return e.model_validated===true&&providerStatus('CYCLE_OWN_MODEL')==='PASS';if(e.sport==='BOAT'&&String(e.model_source||'').startsWith('boat_'))return e.model_validated===true&&providerStatus('BOAT_OWN_MODEL')==='PASS';return modelFresh(e)}
function statusText(e){if(e.status==='FINAL')return fresh(e)?'확정':'확정 · 데이터지연';if(e.status==='CANCELLED')return'취소';if(e.status==='POSTPONED')return'연기';if(e.status==='SUSPENDED')return'중단';if(!fresh(e))return '데이터지연';return e.status==='LIVE'?'LIVE':e.status==='RESULT_PENDING'?'결과대기':'예정'}
function visibleOdds(o){const src=String(o.odds_source||'');const trusted=['KBOAT_FINAL_SINGLE_AUTO','KCYCLE_FINAL_SINGLE_AUTO','KRA_FINAL_SINGLE_AUTO','CPC_FINAL_SINGLE_AUTO','KRA_API301_OFFICIAL','KRA_API28_OFFICIAL','ESPN_PUBLIC_ODDS','SPORTSGAMEODDS'].includes(src);return Number(o.odds)>1&&trusted}
function preOdds(o){const src=String(o.odds_source||'');const mode=String(o.odds_capture_mode||'');const state=String(o.odds_data_state||'FRESH');if(state==='PRESERVED_SAME_DAY')return false;const kraOdds=['KRA_API301_OFFICIAL','KRA_API28_OFFICIAL'].includes(src);const sportsOdds=(src==='ESPN_PUBLIC_ODDS'&&mode==='PRE_GAME_SOURCE_LABELED')||(src==='SPORTSGAMEODDS'&&mode==='PRE_GAME_MULTI_BOOK');const sourceOk=['KBOAT_FINAL_SINGLE_AUTO','KCYCLE_FINAL_SINGLE_AUTO','KRA_FINAL_SINGLE_AUTO','CPC_FINAL_SINGLE_AUTO'].includes(src)||kraOdds||sportsOdds;const modeOk=mode==='PRE_RACE_OFFICIAL'||(kraOdds&&mode==='PRE_RACE')||sportsOdds;return Number(o.odds)>1&&sourceOk&&modeOk}
function probs(e){if(!fresh(e))return{};const valid=(e.outcomes||[]).filter(visibleOdds);if(valid.length<2)return{};const inv=valid.map(o=>1/Number(o.odds)),sum=inv.reduce((a,b)=>a+b,0),m={};valid.forEach((o,i)=>m[o.key]=inv[i]/sum);return m}
function aiTop(e){return (e.outcomes||[]).filter(o=>Number(o.model_p)>0).sort((a,b)=>Number(b.model_p)-Number(a.model_p))[0]||null}
function marketDecision(e){return e?.market_decision&&typeof e.market_decision==='object'?e.market_decision:{}}

function renderTop3Performance(){const p=sportsData?.sports_top3?.performance;if(!p?.summary)return'';const o=p.summary.overall||{},by=p.summary.by_sport||{},sports=['SOCCER','BASEBALL','BASKETBALL','VOLLEYBALL'];const sm=sports.map(k=>{const x=by[k]||{};return `<div class="perfSport"><small>${esc(perfSportLabel(k))}</small><b>${x.evaluated||0}전 · ${perfPct(x.hit_rate)}</b></div>`}).join('');const recent=(p.recent||[]).slice(0,5).map(r=>{const e=r.evaluation,cls=e?(e.hit?'perfHit':'perfMiss'):'perfPending',st=e?(e.hit?'적중':'미적중'):'대기';return `<div class="perfRecentRow"><span>${esc(r.date||'')}</span><b>${esc(r.pick_name||r.pick_key||'-')} · ${esc(r.title||'')}</b><span class="${cls}">${st}</span></div>`}).join('');const need=p.sample_rule?.min_evaluated_per_sport||30;return `<div class="perfBoard"><div class="perfHead"><b>TOP3 누적 성과</b><span>${esc(p.updated_at||'')}</span></div><div class="perfMetrics"><div class="perfMetric"><small>전체 선택</small><b>${o.picks||0}</b></div><div class="perfMetric"><small>평가 완료</small><b>${o.evaluated||0}</b></div><div class="perfMetric"><small>적중/미적중</small><b>${o.hits||0}/${o.misses||0}</b></div><div class="perfMetric"><small>누적 적중률</small><b>${perfPct(o.hit_rate)}</b></div></div><div class="perfSports">${sm}</div>${recent?`<div class="perfRecent"><div class="perfRecentTitle">최근 추천 결과</div>${recent}</div>`:''}<div class="perfSample">종목별 평가 ${need}경기 전까지 기준 고정 · 표본 확보 후 임계값 검토</div></div>`}


function paperKrw(v){const n=Number(v);if(!Number.isFinite(n))return'—';return `${n>=0?'+':''}${Math.round(n).toLocaleString('ko-KR')}원`}
function renderTop3PaperRoi(){const p=sportsData?.sports_top3?.performance?.summary?.overall?.paper_roi;if(!p)return'';const roi=Number(p.roi),profit=Number(p.net_profit_krw||0),cls=profit>0?'paperRoiPlus':profit<0?'paperRoiMinus':'',roiText=Number.isFinite(roi)?`${roi>=0?'+':''}${(roi*100).toFixed(1)}%`:'—';return `<div class="paperRoiBoard"><div class="paperRoiHead"><b>10만원 고정 가상수익</b><span>PAPER ONLY · 추천 확정 시 배당 고정</span></div><div class="paperRoiMetrics"><div class="paperRoiMetric"><small>배당 잠금 추천</small><b>${p.odds_locked_picks||0}</b></div><div class="paperRoiMetric"><small>정산 완료</small><b>${p.settled||0}</b></div><div class="paperRoiMetric"><small>누적 순수익</small><b class="${cls}">${paperKrw(profit)}</b></div><div class="paperRoiMetric"><small>ROI</small><b class="${cls}">${roiText}</b></div></div><div class="paperRoiNote">정산 투자금 ${(Number(p.total_staked_krw||0)).toLocaleString('ko-KR')}원 · 반환 ${(Number(p.total_return_krw||0)).toLocaleString('ko-KR')}원 · 배당 미연결 ${p.excluded_no_locked_odds||0}건은 수익률에서 제외 · 과거 배당 소급 추정 안 함</div></div>`}

function renderTop3Board(){if(domain!=='SPORTS'||view!=='TODAY')return'';const keys=sp==='ALL'?SPORTS.filter(([k])=>k!=='ALL').map(([k])=>k):[sp],blocks=keys.map(k=>{const rows=top3Rows(k),label=LABEL[k]||k;return `<div class="top3Sport"><div class="top3SportHead"><b>${esc(label)} TOP 3</b><span>${rows.length}/3 확정</span></div>${rows.length?rows.map(top3Row).join(''):`<div class="top3Empty">현재 확정 가능한 경기 없음</div>`}</div>`}).join(''),state=sportsData?.sports_top3?.selection_state==='LOCKED_FOR_KST_DATE'?'오늘 확정 · 결과까지 유지':'산출 대기';return `<section class="top3Board"><div class="top3BoardHead"><b>SPORTS 종목별 TOP 3</b><span class="top3Lock">${esc(state)}</span></div>${renderOosProbabilityReport()}${renderTop3Performance()}${renderTop3PaperRoi()}<div class="top3Grid">${blocks}</div></section>`}

function renderRacingPaper(){
 if(domain!=='RACING')return'';
 const p=racingPaper;
 if(!p?.summary)return '<div class="panel"><b>레이싱 · 경기당 10만원 가상베팅</b><p>집계 데이터를 불러오는 중입니다.</p></div>';
 const s=sp==='ALL'?p.summary.overall:p.summary.by_sport[sp];
 const pct=v=>v==null?'—':(v*100).toFixed(1)+'%';
 const money=v=>Number(v||0).toLocaleString('ko-KR')+'원';
 const rows=Object.values(p.records||{}).filter(r=>sp==='ALL'||r.sport===sp).sort((a,b)=>b.date.localeCompare(a.date)||a.start_at.localeCompare(b.start_at)).slice(0,12);
 const states={PENDING:'결과 대기',SETTLED:'정산 완료',NO_OFFICIAL_ODDS:'배당 미확인 · 손익 제외',VOID:'취소 · 투자 제외'};
 return `<section class="paperRoiBoard"><div class="paperRoiHead"><b>${esc(LABEL[sp]||'레이싱')} · 경기당 10만원 가상베팅</b><span>AI 승률 1위 단승 · 모의 전용</span></div><div class="paperRoiMetrics">${[['고정 선택',s.picks+'건'],['적중 / 평가',s.hits+' / '+s.evaluated+'건'],['적중률',pct(s.hit_rate)],['순손익',money(s.net_krw)],['수익률',pct(s.roi)],['정산 투자금',money(s.stake_krw)],['총 환급금',money(s.return_krw)],['결과 대기',s.pending+'건']].map(([k,v])=>`<div class="paperRoiMetric"><small>${k}</small><b>${esc(v)}</b></div>`).join('')}</div><div class="paperRoiNote">경기 전 선택 고정 · 공식 최종 단승배당 정산(사전 배당 잠금 아님) · 배당 미확인 ${s.excluded_no_odds}건 수익률 제외 · 취소 ${s.void}건<br>종목 탭을 누르면 각 종목 누적 성과를 확인할 수 있습니다. 시작 시각 미확인 경기는 선택 제외. 과거 종료 경기는 소급 선택하지 않습니다.<br>집계 갱신 ${esc(p.updated_at)}</div><details><summary>최근 가상베팅 ${rows.length}건 보기</summary>${rows.map(r=>`<div class="perfRecentRow"><span>${esc(r.date)}</span><b>${esc(r.title)} · ${esc(r.pick_name)} (${pct(r.model_p)})</b><span>${r.hit===true?'적중 · ':r.hit===false?'미적중 · ':''}${esc(states[r.settlement]||r.settlement)}${r.settlement==='SETTLED'?' · '+money(r.net_krw):''}</span></div>`).join('')||'<p>경기 전 확률·시각이 확인되면 집계가 시작됩니다.</p>'}</details></section>`;
}

function render(){renderMetrics();const a=scoped(),stale=a.filter(e=>!fresh(e)).length;notice.classList.toggle('warn',stale>0);notice.innerHTML=stale?`<b>${stale}경기 데이터 지연</b> · 지연 데이터에서는 MARKET EDGE 추천을 자동 차단합니다.`:`<b>AI 승률 1위는 추천과 다릅니다.</b> RACEIQ 추천은 배당의 시장확률과 AI확률 차이(EDGE)를 비교하고, 과소평가된 역배를 우선 탐지합니다.`;if(view==='TODAY'){content.innerHTML=`${domain==='SPORTS'?renderTop3Board():renderRacingPaper()}<div class="section"><h2>오늘 경기</h2><span>${a.length}경기</span></div>${a.length?a.map(card).join(''):`<div class="empty"><b>오늘 해당 종목 경기 없음</b>연결된 공식 경기만 표시합니다.</div>`}`;return}if(view==='VALUE'){const sig=a.filter(e=>fresh(e)&&e.status==='SCHEDULED'&&marketDecision(e).primary_pick),up=sig.filter(e=>marketDecision(e).upset_pick),val=sig.filter(e=>marketDecision(e).primary_type==='VALUE');content.innerHTML=`<div class="section"><h2>🔥 UPSET WATCH</h2><span>${up.length}건</span></div>${up.length?up.sort((a,b)=>Number(marketDecision(b).upset_pick.edge)-Number(marketDecision(a).upset_pick.edge)).map(e=>signalPanel(e,marketDecision(e).upset_pick,'UPSET')).join(''):`<div class="empty"><b>현재 검증된 역배 후보 없음</b>억지로 역배를 만들지 않습니다. AI확률이 시장확률보다 최소 +5%p 높고 EV +8% 이상인 역배만 표시합니다.</div>`}<div class="section"><h2>MARKET VALUE</h2><span>${val.length}건</span></div>${val.length?val.sort((a,b)=>Number(marketDecision(b).value_pick.edge)-Number(marketDecision(a).value_pick.edge)).map(e=>signalPanel(e,marketDecision(e).value_pick,'VALUE')).join(''):`<div class="empty"><b>추가 VALUE 없음</b>정배/역배와 무관하게 시장 대비 EDGE가 부족하면 NO BET입니다.</div>`}`;return}if(view==='ANALYSIS'){const odds=a.filter(e=>fresh(e)&&e.status==='SCHEDULED'&&(e.outcomes||[]).some(preOdds)).length,models=a.filter(e=>(e.outcomes||[]).some(o=>Number(o.model_p)>0)).length,up=a.filter(e=>marketDecision(e).upset_pick).length,val=a.filter(e=>marketDecision(e).value_pick).length;content.innerHTML=`<div class="section"><h2>분석 상태</h2></div><div class="panel"><div class="kv"><span>현재 경기</span><span>${a.length}경기</span></div><div class="kv"><span>사용가능 배당</span><span>${odds}경기</span></div><div class="kv"><span>AI확률 연결</span><span>${models}경기</span></div><div class="kv"><span>역배 후보</span><span>${up}건</span></div><div class="kv"><span>VALUE 후보</span><span>${val}건</span></div><div class="kv"><span>확정 결과</span><span>${a.filter(e=>e.status==='FINAL').length}경기</span></div><p>추천 순위는 순수 승률이 아니라 시장확률 대비 EDGE와 EV를 사용합니다. 기준 미달이면 정배도 추천하지 않습니다.</p></div>`;return}content.innerHTML=`<div class="section"><h2>설정</h2></div><div class="panel"><div class="kv"><span>자동수집</span><span>약 5분 주기</span></div><div class="kv"><span>화면갱신</span><span>10초</span></div><div class="kv"><span>AI 승률</span><span>순수 승리확률 · 추천과 분리</span></div><div class="kv"><span>MARKET EDGE</span><span>AI확률 - 배당 내재확률</span></div><div class="kv"><span>VALUE 기준</span><span>EDGE ≥ +3%p · EV ≥ +5%</span></div><div class="kv"><span>UPSET 기준</span><span>시장 1순위가 아닌 선택 · EDGE ≥ +5%p · EV ≥ +8%</span></div><div class="kv"><span>추천 우선순위</span><span>UPSET → VALUE → 기준 미달 NO BET</span></div><div class="kv"><span>안전장치</span><span>검증 모델 + 경기전 배당 + STALE 차단</span></div><div class="kv"><span>배당 출처</span><span>RACING 공식 · SPORTS 출처표시/다중북 구분</span></div></div>`}
async function load(){try{const ts=Date.now();const [rr,sr,pr]=await Promise.all([fetch(`./data/today.json?ts=${ts}`,{cache:'no-store'}),fetch(`./data/sports_today.json?ts=${ts}`,{cache:'no-store'}),fetch(`./data/model_state/racing_paper.json?ts=${ts}`,{cache:'no-store'}).catch(()=>null)]);if(!rr.ok)throw Error('RACING HTTP '+rr.status);racingData=await rr.json();racingPaper=pr?.ok?await pr.json():null;sportsData=sr.ok?await sr.json():{events:[],providers:[],time:'--:--:--'};data=domain==='RACING'?racingData:sportsData;const stale=(data.events||[]).filter(e=>!fresh(e)).length;badge.textContent=(stale?'▲ ':'● ')+(data.time||'')+' 갱신';badge.classList.toggle('warn',stale>0);render()}catch(e){badge.textContent='업데이트 오류';badge.classList.add('warn');render()}}
load();setInterval(load,10000);
</script></body></html>

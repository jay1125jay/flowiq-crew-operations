<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#061019"><title>RACE SPORTS</title><style>
:root{--bg:#061019;--panel:#0b1722;--line:#1c3042;--text:#f6f8fb;--muted:#8092a7;--green:#3ce6a2;--amber:#ffd276;--red:#ff6b74;--blue:#6594ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}body{padding-bottom:78px}button{font:inherit;cursor:pointer}.top{position:sticky;top:0;z-index:10;background:#061019f4;border-bottom:1px solid var(--line);padding:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:950;color:#061019;background:linear-gradient(145deg,#3ce6a2,#6594ff)}.title{font-size:14px;font-weight:950;letter-spacing:.08em}.sub{font-size:9px;color:var(--muted);margin-top:2px}.badge{font-size:9px;color:#b5f5d5;border:1px solid #2a5b46;background:#10261d;border-radius:999px;padding:6px 9px}.tabs{display:flex;gap:6px;margin-top:10px;overflow:auto;scrollbar-width:none}.tab{flex:0 0 auto;border:1px solid var(--line);background:#09141e;color:var(--muted);padding:8px 13px;border-radius:999px;font-size:11px;font-weight:850}.tab.on{color:#eafff3;background:#153127;border-color:#326d54}main{padding:10px;max-width:760px;margin:auto}.dash{border:1px solid var(--line);background:linear-gradient(145deg,#0d1b27,#09141e);border-radius:15px;padding:12px}.ey{font-size:9px;color:var(--green);font-weight:900;letter-spacing:.14em}.hero{font-size:21px;font-weight:950;margin-top:5px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.m{border:1px solid #173048;background:#07111a;border-radius:10px;padding:9px}.m small{display:block;color:var(--muted);font-size:8px}.m b{font-size:16px}.notice{margin:9px 0;border:1px solid #244159;background:#0a1722;color:#a8b8c8;border-radius:10px;padding:9px 10px;font-size:9px;line-height:1.55}.section{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 7px}.section h2{font-size:16px;margin:0}.section span{font-size:10px;color:var(--muted)}.event{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#0c1924,#08131c);overflow:hidden;margin-bottom:9px}.head{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;padding:9px 10px;border-bottom:1px solid #162a3a}.time{font-size:17px;font-weight:950}.league{font-size:11px;font-weight:900}.meta{font-size:8px;color:var(--muted);margin-top:2px}.status{font-size:8px;color:#b5f6d4;border:1px solid #28543f;background:#10251c;border-radius:7px;padding:5px 7px;font-weight:900}.status.live{color:#ffb4b9;border-color:#6d3338;background:#331a1c}.status.final{color:#ffe59b;border-color:#70602a;background:#2b2510}.aiPick{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #1d3b31;background:#10231d;font-size:10px}.aiPick small{color:#7fa895}.aiPick b{color:#caffdf;font-size:11px}.aiTag{display:inline-block;margin-left:5px;padding:2px 5px;border:1px solid #346a53;border-radius:999px;color:#7ff0b7;font-size:7px;vertical-align:1px}.gridHead,.runner{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px 58px;gap:5px;align-items:center}.gridHead{padding:6px 10px;color:#6f8295;font-size:8px;border-bottom:1px solid #13283a}.runner{padding:8px 10px;border-bottom:1px solid #13283a;font-size:10px}.runner.aiwin{background:#0e211b;box-shadow:inset 3px 0 0 var(--green)}.runner:last-child{border-bottom:0}.nm{font-size:11px;font-weight:850}.num{text-align:right;font-weight:900}.model{color:#a9b8c7}.aiwin .model{color:#7ff0b7}.market{color:#75d9ff}.odds{color:#b9f5d7}.leader{color:#ffd276}.result{padding:9px 10px;border-bottom:1px solid #162a3a;background:#111b22}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pod{border:1px solid #2d4050;border-radius:9px;padding:7px;text-align:center}.pod b{display:block;font-size:15px}.pod small{color:var(--muted)}.payouts{display:flex;gap:5px;overflow:auto;margin-top:7px}.pay{flex:0 0 auto;border:1px solid #2b4259;border-radius:8px;padding:6px 8px;background:#09141e}.pay small{display:block;color:var(--muted);font-size:7px}.pay b{font-size:10px}.bullMatch{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:10px;align-items:center}.bullMatch .side:last-child{text-align:right}.bullMatch small{display:block;color:var(--muted);font-size:8px}.bullMatch b{font-size:14px}.foot{display:flex;justify-content:space-between;padding:7px 10px;border-top:1px solid #162a3a;color:var(--muted);font-size:8px}.empty,.panel{padding:22px 16px;color:var(--muted);border:1px solid var(--line);border-radius:14px;background:#0b1520}.empty{text-align:center}.empty b,.panel b{display:block;color:#dce5ed;margin-bottom:6px}.panel h3{margin:0 0 8px;color:#eef3f8;font-size:15px}.panel p{margin:6px 0;font-size:11px;line-height:1.55}.kv{display:grid;grid-template-columns:115px 1fr;gap:7px;font-size:11px;padding:6px 0;border-bottom:1px solid #152839}.kv span:first-child{color:var(--muted)}.bottom{position:fixed;left:10px;right:10px;bottom:9px;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #293c4f;background:#09111af7;border-radius:14px;overflow:hidden;z-index:20}.bottom button{border:0;background:transparent;padding:12px 2px;text-align:center;color:#78899c;font-size:10px;font-weight:850}.bottom button.on{color:var(--green);background:#12302655}
</style></head><body>
<header class="top"><div class="row"><div class="brand"><div class="logo">RS</div><div><div class="title">RACE SPORTS</div><div class="sub">OFFICIAL DATA · 4-SPORT GITHUB CLOUD</div></div></div><div class="badge" id="badge">연결중</div></div><div class="tabs" id="tabs"></div></header>
<main><section class="dash"><div class="ey">TODAY / KST</div><div class="hero" id="hero">전체 종목</div><div class="metrics"><div class="m"><small>오늘 경기</small><b id="cnt">0</b></div><div class="m"><small>LIVE</small><b id="liveCnt">0</b></div><div class="m"><small>확정</small><b id="finalCnt">0</b></div><div class="m"><small>AI연결</small><b id="modelCnt">0</b></div></div></section><div class="notice" id="notice"><b>경정 AI확률은 KBOAT 공식 AI 우승확률</b>을 표시합니다. 단승배당은 경기 시작 직전에 공식 페이지에 공개되는 값을 수집하며, 종료 후 확정배당과는 별도입니다. 숫자가 없는 배당은 임의 생성하지 않습니다.</div><div id="content"></div></main>
<nav class="bottom"><button class="on" data-view="TODAY">오늘</button><button data-view="VALUE">VALUE</button><button data-view="ANALYSIS">분석</button><button data-view="SETTINGS">설정</button></nav>
<script>
const SPORTS=[['ALL','전체'],['HORSE','경마'],['CYCLE','경륜'],['BOAT','경정'],['BULL','소싸움']],LABEL=Object.fromEntries(SPORTS);let data={events:[],providers:[]},sp='ALL',view='TODAY';
const tabs=document.getElementById('tabs');tabs.innerHTML=SPORTS.map(([k,v],i)=>`<button class="tab ${i?'':'on'}" data-sport="${k}">${v}</button>`).join('');
tabs.addEventListener('click',e=>{const b=e.target.closest('button[data-sport]');if(!b)return;sp=b.dataset.sport;tabs.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render()});
document.querySelector('.bottom').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(!b)return;view=b.dataset.view;document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('on',x===b));render()});
function scoped(){return (data.events||[]).filter(e=>sp==='ALL'||e.sport===sp)}
function statusText(s){return s==='FINAL'?'확정':s==='LIVE'?'LIVE':s==='RESULT_PENDING'?'결과대기':'예정'}
function probs(e){const valid=(e.outcomes||[]).filter(o=>Number(o.odds)>0);if(valid.length<2)return{};const inv=valid.map(o=>1/Number(o.odds)),sum=inv.reduce((a,b)=>a+b,0),m={};valid.forEach((o,i)=>m[o.key]=inv[i]/sum);return m}
function aiTop(e){return (e.outcomes||[]).filter(o=>Number(o.model_p)>0).sort((a,b)=>Number(b.model_p)-Number(a.model_p))[0]||null}
function resultBox(e){if(!e.result?.top3)return'';const pods=e.result.top3.map(x=>`<div class="pod"><small>${x.rank}위</small><b>${x.number}</b><div>${x.name}</div></div>`).join('');const pays=(e.result.markets||[]).map(x=>`<div class="pay"><small>${x.market} ${x.winner||''}</small><b>${x.odds||'-'}배</b></div>`).join('');return `<div class="result"><div class="podium">${pods}</div>${pays?`<div class="payouts">${pays}</div>`:''}</div>`}
function aiBox(e){const t=aiTop(e);if(!t)return'';const src=t.model_source==='KBOAT_AI_OFFICIAL'?'KBOAT 공식 AI':'검증 모델';return `<div class="aiPick"><span><small>${src} · 우승확률 1위</small><br><b>${t.name}</b></span><b>${(Number(t.model_p)*100).toFixed(1)}%</b></div>`}
function runners(e){const mp=probs(e),marketTop=Object.entries(mp).sort((a,b)=>b[1]-a[1])[0]?.[0],top=aiTop(e)?.key;if(!(e.outcomes||[]).length)return `<div class="empty"><b>출전자 상세 수집 대기</b>공식 일정은 확인됐고 출전자 상세 파서를 연결 중입니다.</div>`;return `<div class="gridHead"><span>출전</span><span>AI확률</span><span>시장확률</span><span>배당</span></div>`+(e.outcomes||[]).map(o=>{const p=Number(o.model_p),m=mp[o.key],d=Number(o.odds),isTop=top===o.key;return `<div class="runner ${isTop?'aiwin':''}"><span class="nm">${o.name}${isTop?`<span class="aiTag">AI 1위</span>`:''}${o.final_rank?` · <span class="leader">${o.final_rank}위</span>`:''}</span><span class="num model">${p>0?(p*100).toFixed(1)+'%':'—'}</span><span class="num market ${marketTop===o.key?'leader':''}">${m?(m*100).toFixed(1)+'%':'—'}</span><span class="num odds">${d>0?d.toFixed(1):'—'}</span></div>`}).join('')}
function card(e){const head=`<div class="head"><div class="time">${e.start_time||'--:--'}</div><div><div class="league">${e.competition||LABEL[e.sport]||e.sport}</div><div class="meta">${e.title||e.id} · ${e.provider||'-'}</div></div><div class="status ${e.status==='LIVE'?'live':e.status==='FINAL'?'final':''}">${statusText(e.status)}</div></div>`;const match=e.market_type==='THREE_WAY'?`<div class="bullMatch"><div class="side"><small>홍</small><b>${e.left||'-'}</b></div><div>VS</div><div class="side"><small>청</small><b>${e.right||'-'}</b></div></div>`:'';const hasOdds=(e.outcomes||[]).some(o=>Number(o.odds)>0);return `<article class="event">${head}${resultBox(e)}${match}${aiBox(e)}${runners(e)}<div class="foot"><span>${e.status==='FINAL'?'공식 결과':'공식 출전표'}</span><span>${e.status==='FINAL'?'확정배당 표시':hasOdds?'경기전 단승배당 수집':'경기전 배당 공개 대기'}</span></div></article>`}
function renderMetrics(){const a=scoped();cnt.textContent=a.length;liveCnt.textContent=a.filter(e=>e.status==='LIVE').length;finalCnt.textContent=a.filter(e=>e.status==='FINAL').length;modelCnt.textContent=a.filter(e=>(e.outcomes||[]).some(o=>Number(o.model_p)>0)).length;hero.textContent=(sp==='ALL'?'전체':LABEL[sp])+' 종목'}
function render(){renderMetrics();const a=scoped();if(view==='TODAY'){content.innerHTML=`<div class="section"><h2>오늘 경기</h2><span>${a.length}경기</span></div>${a.length?a.map(card).join(''):`<div class="empty"><b>오늘 해당 종목 경기 없음</b>공식 경기만 표시합니다.</div>`}`;return}if(view==='VALUE'){const picks=[];a.forEach(e=>(e.outcomes||[]).forEach(o=>{const p=Number(o.model_p),d=Number(o.odds);if(p>0&&d>0){const ev=p*d-1;if(ev>=.05)picks.push({e,o,ev})}}));content.innerHTML=`<div class="section"><h2>VALUE</h2><span>${picks.length}건</span></div>${picks.length?picks.sort((a,b)=>b.ev-a.ev).map(x=>`<div class="panel"><b>${x.e.title} · ${x.o.name}</b><p>AI ${(Number(x.o.model_p)*100).toFixed(1)}% · 배당 ${Number(x.o.odds).toFixed(1)} · 계산 EV +${(x.ev*100).toFixed(1)}%</p></div>`).join(''):`<div class="empty"><b>계산 가능한 VALUE 없음</b>AI확률과 경기전 실제 배당이 동시에 있어야 EV를 계산합니다.</div>`}`;return}if(view==='ANALYSIS'){const odds=a.filter(e=>(e.outcomes||[]).some(o=>Number(o.odds)>0)).length,models=a.filter(e=>(e.outcomes||[]).some(o=>Number(o.model_p)>0)).length;content.innerHTML=`<div class="section"><h2>분석 상태</h2></div><div class="panel"><div class="kv"><span>4종목 데이터</span><span>GitHub Cloud 독립수집</span></div><div class="kv"><span>현재 경기</span><span>${a.length}경기</span></div><div class="kv"><span>경기전 배당</span><span>${odds}경기</span></div><div class="kv"><span>AI확률 연결</span><span>${models}경기</span></div><div class="kv"><span>확정 결과</span><span>${a.filter(e=>e.status==='FINAL').length}경기</span></div><p>경정 AI확률은 KBOAT 공식 순위예측의 선수별 우승확률입니다. 시장확률은 실제 단승배당이 수집된 경우에만 1/배당을 정규화해 표시합니다.</p></div>`;return}content.innerHTML=`<div class="section"><h2>설정</h2></div><div class="panel"><div class="kv"><span>운영</span><span>PC 불필요</span></div><div class="kv"><span>수집</span><span>GitHub Actions 약 5분</span></div><div class="kv"><span>화면</span><span>10초 새로고침</span></div><div class="kv"><span>종목</span><span>경마 · 경륜 · 경정 · 소싸움</span></div><div class="kv"><span>경정 AI확률</span><span>KBOAT 공식 AI 우승확률</span></div><div class="kv"><span>배당</span><span>경기전 현재배당 / 종료후 확정배당 분리</span></div></div>`}
async function load(){try{const r=await fetch(`./data/today.json?ts=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();badge.textContent='● '+(data.time||'')+' 갱신';badge.classList.remove('warn');render()}catch(e){badge.textContent='업데이트 오류';badge.classList.add('warn');render()}}
load();setInterval(load,10000);
</script></body></html>

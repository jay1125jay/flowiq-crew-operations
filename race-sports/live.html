<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#061019"><title>RACE SPORTS</title><style>
:root{--bg:#061019;--panel:#0b1722;--line:#1c3042;--text:#f6f8fb;--muted:#8092a7;--green:#3ce6a2;--amber:#ffd276;--red:#ff6b74;--blue:#6594ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}body{padding-bottom:78px}button{font:inherit}.top{position:sticky;top:0;z-index:10;background:#061019f4;border-bottom:1px solid var(--line);padding:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:950;color:#061019;background:linear-gradient(145deg,#3ce6a2,#6594ff)}.title{font-size:14px;font-weight:950;letter-spacing:.08em}.sub{font-size:9px;color:var(--muted);margin-top:2px}.badge{font-size:9px;color:#b5f5d5;border:1px solid #2a5b46;background:#10261d;border-radius:999px;padding:6px 9px}.badge.warn{color:#ffe7a1;border-color:#6d5d2b;background:#2b240f}.tabs{display:flex;gap:6px;margin-top:10px;overflow:auto;scrollbar-width:none}.tab{flex:0 0 auto;border:1px solid var(--line);background:#09141e;color:var(--muted);padding:7px 12px;border-radius:999px;font-size:11px;font-weight:850}.tab.on{color:#eafff3;background:#153127;border-color:#326d54}main{padding:10px;max-width:760px;margin:auto}.dash{border:1px solid var(--line);background:linear-gradient(145deg,#0d1b27,#09141e);border-radius:15px;padding:12px}.ey{font-size:9px;color:var(--green);font-weight:900;letter-spacing:.14em}.hero{font-size:21px;font-weight:950;margin-top:5px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.m{border:1px solid #173048;background:#07111a;border-radius:10px;padding:9px}.m small{display:block;color:var(--muted);font-size:8px}.m b{font-size:16px}.notice{margin:9px 0;border:1px solid #244159;background:#0a1722;color:#9fb1c3;border-radius:10px;padding:9px 10px;font-size:9px;line-height:1.45}.section{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 7px}.section h2{font-size:16px;margin:0}.section span{font-size:10px;color:var(--muted)}.event{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#0c1924,#08131c);overflow:hidden;margin-bottom:9px}.head{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;padding:9px 10px;border-bottom:1px solid #162a3a}.time{font-size:17px;font-weight:950}.league{font-size:11px;font-weight:900}.meta{font-size:8px;color:var(--muted);margin-top:2px}.status{font-size:8px;color:#b5f6d4;border:1px solid #28543f;background:#10251c;border-radius:7px;padding:5px 7px;font-weight:900}.status.live{color:#ffb4b9;border-color:#6d3338;background:#331a1c}.status.final{color:#ffe59b;border-color:#70602a;background:#2b2510}.runners{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}.runner{padding:8px 10px;border-top:1px solid #13283a;font-size:11px;font-weight:800;display:flex;justify-content:space-between;gap:6px}.runner:nth-child(odd){border-right:1px solid #13283a}.odds{color:#b9f5d7;font-weight:950}.rank{color:#ffe18a}.result{padding:9px 10px;border-bottom:1px solid #162a3a;background:#111b22}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pod{border:1px solid #2d4050;border-radius:9px;padding:7px;text-align:center}.pod b{display:block;font-size:15px}.pod small{color:var(--muted)}.payouts{display:flex;gap:5px;overflow:auto;margin-top:7px}.pay{flex:0 0 auto;border:1px solid #2b4259;border-radius:8px;padding:6px 8px;background:#09141e}.pay small{display:block;color:var(--muted);font-size:7px}.pay b{font-size:10px}.foot{display:flex;justify-content:space-between;padding:7px 10px;border-top:1px solid #162a3a;color:var(--muted);font-size:8px}.empty,.panel{padding:26px 18px;text-align:center;color:var(--muted);border:1px solid var(--line);border-radius:14px;background:#0b1520}.empty b,.panel b{display:block;color:#dce5ed;margin-bottom:6px}.panel{text-align:left}.panel h3{margin:0 0 8px;color:#eef3f8;font-size:15px}.panel p{margin:6px 0;font-size:11px;line-height:1.55}.kv{display:grid;grid-template-columns:110px 1fr;gap:7px;font-size:11px;padding:5px 0;border-bottom:1px solid #152839}.kv span:first-child{color:var(--muted)}.bottom{position:fixed;left:10px;right:10px;bottom:9px;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #293c4f;background:#09111af7;border-radius:14px;overflow:hidden;z-index:20}.bottom button{border:0;background:transparent;padding:11px 2px;text-align:center;color:#78899c;font-size:9px;font-weight:850}.bottom button.on{color:var(--green);background:#12302655}
</style></head><body>
<header class="top"><div class="row"><div class="brand"><div class="logo">RS</div><div><div class="title">RACE SPORTS</div><div class="sub">OFFICIAL DATA · GITHUB CLOUD FEED</div></div></div><div class="badge" id="badge">연결중</div></div><div class="tabs" id="tabs"></div></header>
<main><section class="dash"><div class="ey">TODAY / KST</div><div class="hero" id="hero">전체 종목</div><div class="metrics"><div class="m"><small>오늘 경기</small><b id="cnt">0</b></div><div class="m"><small>LIVE</small><b id="liveCnt">0</b></div><div class="m"><small>확정</small><b id="finalCnt">0</b></div><div class="m"><small>VALUE</small><b id="valueCnt">0</b></div></div></section><div class="notice" id="notice">Supabase 402를 우회해 GitHub Cloud가 공식 경정 데이터를 직접 갱신합니다.</div><div id="content"></div></main>
<nav class="bottom"><button class="on" data-view="TODAY">오늘</button><button data-view="VALUE">VALUE</button><button data-view="ANALYSIS">분석</button><button data-view="SETTINGS">설정</button></nav>
<script>
const SPORTS=[['ALL','전체'],['HORSE','경마'],['CYCLE','경륜'],['BOAT','경정'],['BULL','소싸움']];
const LABEL=Object.fromEntries(SPORTS);let data=null,sp='ALL',view='TODAY';
const fallback=[['11:40','01경주',['1 김종목','2 양원준','3 김완석','4 이지은','5 김승택','6 김재윤']],['12:03','02경주',['1 송효범','2 김국흠','3 정주현','4 장수영','5 이수빈','6 김민준']],['12:26','03경주',['1 김선웅','2 정용진','3 임태경','4 김효년','5 김계영','6 윤동오']],['12:49','04경주',['1 김명진','2 고정환','3 신동길','4 정승호','5 김응선','6 이주영']],['13:12','05경주',['1 최진혁','2 기광서','3 김희용','4 김현덕','6 강영길']],['13:35','06경주',['1 이진우','2 김경일','3 홍기철','4 염윤정','5 어선규','6 문안나']],['13:58','07경주',['1 최영재','2 한준희','3 김지현','4 조승민','5 김도휘','6 손지영']],['14:21','08경주',['2 김상범','3 류해광','4 주은석','5 김기한','6 김종목']],['14:45','09경주',['1 김종민','2 이은지','3 한종석','4 이상문','5 김완석','6 길현태']],['15:09','10경주',['1 장수영','2 이휘동','3 박민성','4 이동준','5 정용진','6 신선길']],['15:33','11경주',['1 김민준','2 이승일','4 박지윤','5 양원준','6 김선웅']],['15:57','12경주',['1 정훈민','2 김효년','3 김태규','4 고정환','5 배혜민','6 송효범']],['16:21','13경주',['1 윤동오','3 김태영','4 박원규','5 김국흠','6 박종덕']],['16:45','14경주',['1 이주영','2 김계영','3 이용세','4 박석문','5 김영민','6 황이태']],['17:09','15경주',['1 김현덕','2 오상현','3 김재윤','5 손유정','6 이진우']],['17:33','16경주',['1 문안나','2 김도휘','3 이명현','4 김종민','5 기광서','6 김명진']],['17:57','17경주',['1 조승민','2 김응선','3 길현태','4 이휘동','5 염윤정','6 최진혁']]];
function fallbackData(){return{date:'2026-10-01',time:'11:50:00',mode:'EMBEDDED_FALLBACK',events:fallback.map((x,i)=>({id:'FB'+i,sport:'BOAT',provider:'KBOAT',competition:'미사리 경정 40회차 2일차',start_time:x[0],title:x[1],status:'SCHEDULED',outcomes:x[2].map((n,j)=>({key:'N'+(j+1),name:n,number:+n.split(' ')[0]}))})),providers:[]}}
function statusText(s){return s==='FINAL'?'확정':s==='LIVE'?'LIVE':s==='RESULT_PENDING'?'결과대기':'예정'}
function resultBox(e){if(!e.result?.top3)return'';const pods=e.result.top3.map(x=>`<div class="pod"><small>${x.rank}위</small><b>${x.number}</b><div>${x.name}</div></div>`).join('');const pays=(e.result.markets||[]).map(x=>`<div class="pay"><small>${x.market} ${x.winner||''}</small><b>${x.odds||'-'}배</b></div>`).join('');return `<div class="result"><div class="podium">${pods}</div>${pays?`<div class="payouts">${pays}</div>`:''}</div>`}
function card(e){return `<article class="event"><div class="head"><div class="time">${e.start_time||'--:--'}</div><div><div class="league">${e.competition||LABEL[e.sport]||e.sport}</div><div class="meta">${e.title||e.id} · ${e.provider||'-'}</div></div><div class="status ${e.status==='LIVE'?'live':e.status==='FINAL'?'final':''}">${statusText(e.status)}</div></div>${resultBox(e)}<div class="runners">${(e.outcomes||[]).map(o=>`<div class="runner"><span>${o.name}</span><span>${o.final_rank?`<span class="rank">${o.final_rank}위</span>`:(o.odds?`<span class="odds">${Number(o.odds).toFixed(1)}</span>`:'')}</span></div>`).join('')}</div><div class="foot"><span>${e.status==='FINAL'?'공식 결과':'공식 출전표'}</span><span>${e.status==='FINAL'?'당일 유지':(e.outcomes||[]).some(o=>o.odds)?'단승 자동배당':'자동수집'}</span></div></article>`}
function scoped(){return (data?.events||[]).filter(e=>sp==='ALL'||e.sport===sp)}
function renderMetrics(){const a=scoped();cnt.textContent=a.length;liveCnt.textContent=a.filter(e=>e.status==='LIVE').length;finalCnt.textContent=a.filter(e=>e.status==='FINAL').length;valueCnt.textContent=a.reduce((n,e)=>n+(e.outcomes||[]).filter(o=>o.model_p&&o.odds&&o.model_p*o.odds-1>=.05).length,0);hero.textContent=(sp==='ALL'?'전체':LABEL[sp])+' 종목'}
function render(){renderMetrics();const a=scoped();if(view==='TODAY'){content.innerHTML=`<div class="section"><h2>오늘 경기</h2><span>${a.length}경기</span></div>${a.length?a.map(card).join(''):`<div class="empty"><b>오늘 해당 종목 경기 없음</b>공식 경기만 표시합니다.</div>`}`;return}if(view==='VALUE'){const picks=[];a.forEach(e=>(e.outcomes||[]).forEach(o=>{if(o.model_p&&o.odds){const ev=o.model_p*o.odds-1;if(ev>=.05)picks.push({e,o,ev})}}));content.innerHTML=`<div class="section"><h2>VALUE</h2><span>${picks.length}건</span></div>${picks.length?picks.map(x=>`<div class="panel"><b>${x.e.title} · ${x.o.name}</b><p>모델 ${(x.o.model_p*100).toFixed(1)}% · 배당 ${x.o.odds} · EV +${(x.ev*100).toFixed(1)}%</p></div>`).join(''):`<div class="empty"><b>현재 VALUE 신호 없음</b>검증된 모델 확률과 공식 배당이 모두 있을 때만 표시합니다.</div>`}`;return}if(view==='ANALYSIS'){content.innerHTML=`<div class="section"><h2>분석</h2></div><div class="panel"><h3>오늘 데이터 상태</h3><div class="kv"><span>경기</span><span>${a.length}경기</span></div><div class="kv"><span>LIVE</span><span>${a.filter(e=>e.status==='LIVE').length}</span></div><div class="kv"><span>결과확정</span><span>${a.filter(e=>e.status==='FINAL').length}</span></div><div class="kv"><span>배당 연결</span><span>${a.reduce((n,e)=>n+(e.outcomes||[]).filter(o=>o.odds).length,0)}개 outcome</span></div><p>경정 예측모델은 아직 검증 완료 전이라 임의 확률을 표시하지 않습니다.</p></div>`;return}content.innerHTML=`<div class="section"><h2>설정</h2></div><div class="panel"><h3>수집 시스템</h3><div class="kv"><span>프론트</span><span>GitHub Pages</span></div><div class="kv"><span>실시간 소스</span><span>KBOAT 공식 페이지</span></div><div class="kv"><span>서버 갱신</span><span>약 5분</span></div><div class="kv"><span>화면 확인</span><span>10초</span></div><div class="kv"><span>Supabase</span><span>402 우회 중</span></div></div>`}
function setSport(c){sp=c;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.s===c));render()}
function setView(v){view=v;document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));render()}
tabs.innerHTML=SPORTS.map((x,i)=>`<button class="tab ${i===0?'on':''}" data-s="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setSport(b.dataset.s)));document.querySelectorAll('.bottom button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
async function load(){try{const r=await fetch('./data/today.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();badge.classList.remove('warn');badge.textContent='● '+(data.time||'')+' 자동갱신';notice.innerHTML='Supabase 402를 우회해 <b>GitHub Cloud가 KBOAT 공식 출전표·단승배당·결과를 약 5분마다 수집</b>합니다.'}catch(e){if(!data)data=fallbackData();badge.classList.add('warn');badge.textContent='스냅샷 모드';notice.innerHTML='자동 수집 파일 생성 전이라 <b>저장된 오늘 경정 17경기 스냅샷</b>을 표시 중입니다.'}render()}
load();setInterval(load,10000);
</script></body></html>

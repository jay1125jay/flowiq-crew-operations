<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061019"><title>RACEIQ</title><style>html,body{margin:0;background:#061019;color:#f6f8fb;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;height:100%}body{display:grid;place-items:center}.box{text-align:center;padding:28px}.logo{width:180px;height:auto;border-radius:9px;margin:0 auto 16px;display:block;background:#fff}h1{font-size:20px;margin:0 0 8px}p{font-size:13px;color:#91a2b4;margin:0}.ok{color:#3ce6a2}</style></head><body><div class="box"><img class="logo" src="./assets/raceiq-logo.jpg" alt="RACEIQ"><h1>최신 화면 적용 중</h1><p id="msg">캐시를 초기화합니다.</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()));}if('caches'in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)));}document.getElementById('msg').innerHTML='<span class="ok">초기화 완료</span> · 최신 RACEIQ 화면으로 이동합니다.';}catch(e){}setTimeout(()=>location.replace('./live.html?v=20261004-timefix&ts='+Date.now()),400)})();</script></body></html>

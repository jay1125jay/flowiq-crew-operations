<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061019">
<title>RACE SPORTS 새로고침</title>
<style>html,body{margin:0;background:#061019;color:#f6f8fb;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;height:100%}body{display:grid;place-items:center}.box{text-align:center;padding:28px}.logo{width:56px;height:56px;border-radius:16px;margin:0 auto 16px;display:grid;place-items:center;font-weight:950;color:#06110c;background:linear-gradient(145deg,#3ce6a2,#6594ff)}h1{font-size:20px;margin:0 0 8px}p{font-size:13px;color:#91a2b4;margin:0}.ok{color:#3ce6a2}</style>
</head>
<body><div class="box"><div class="logo">RS</div><h1>최신 버전 적용 중</h1><p id="msg">캐시를 초기화하고 다시 연결합니다.</p></div>
<script>
(async()=>{
 try{
  if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}
  if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}
  document.getElementById('msg').innerHTML='<span class="ok">초기화 완료</span> · 최신 화면으로 이동합니다.';
 }catch(e){document.getElementById('msg').textContent='최신 화면으로 이동합니다.';}
 setTimeout(()=>location.replace('./?v=5-direct-db-'+Date.now()),500);
})();
</script></body></html>

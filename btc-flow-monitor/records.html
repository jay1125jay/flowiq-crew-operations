<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>거래 기록 · 캐쉬 플로우</title><link rel="icon" href="./cash-whale-192.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#080d13;color:#eef4fb;font:16px/1.5 system-ui,sans-serif}main{max-width:950px;margin:auto;padding:22px 16px}header,.totals,article{display:flex;gap:12px;justify-content:space-between;align-items:center}h1{margin:12px 0;font-size:28px}a{color:#70e5bc}small,time,#status{color:#a7b5c5}section,article{background:#101923;border:1px solid #253545;border-radius:12px;padding:14px}.totals{margin:10px 0 18px}.totals section{flex:1}strong,time,b{display:block}.gain{color:#57dfa8}.loss{color:#ff8995}article{margin:8px 0}.amount{text-align:right}time,small{font-size:13px}
</style>
<main><header><h1>거래 기록</h1><a href="./dashboard.html">대시보드</a></header>
<p>고래별 모의계좌 · 수수료 차감 후 확정 손익 · 한국시간</p>
<div class="totals"><section>누적 이익금<strong class="gain" id="gain">—</strong></section><section>누적 손실금<strong class="loss" id="loss">—</strong></section></div>
<p id="status" role="status">조회 중…</p><div id="history"></div></main>
<script>
const el=id=>document.getElementById(id);
const money=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const fmt=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function node(tag,value,cls=''){
  const n=document.createElement(tag);n.textContent=value;n.className=cls;return n;
}
function render(paper){
  const rows=Object.entries(paper.accounts).flatMap(([wallet,a])=>
    (a.fill_cursor===undefined?[]:a.closed||[]).map((trade,index)=>({wallet,trade,index})));
  rows.sort((a,b)=>Date.parse(b.trade.closed)-Date.parse(a.trade.closed)||b.index-a.index);
  let gains=0,losses=0;
  const list=document.createDocumentFragment();
  for(const {wallet,trade} of rows){
    const net=trade.net_krw;
    if(!Number.isFinite(net))throw Error('invalid net');
    gains+=Math.max(0,net);losses+=Math.max(0,-net);
    const card=document.createElement('article'),left=document.createElement('div'),right=node('div','','amount');
    const type=trade.reason==='liquidation'?'강제 청산':trade.close_fraction==null?'청산':trade.close_fraction<1?'부분 청산':'전량 청산';
    const when=node('time',fmt.format(new Date(trade.closed)));when.dateTime=trade.closed;
    const who=node('small',wallet.slice(0,8)+'…'+wallet.slice(-4));who.title=wallet;
    left.append(when,node('b',(trade.side===1?'롱 ':'숏 ')+type),who);
    right.append(node('strong',(net>0?'이익 +':net<0?'손실 −':'손익 ')+money(Math.abs(net)),net>0?'gain':net<0?'loss':''));
    if(Number.isFinite(trade.cash_after_krw))right.append(node('small','청산 후 현금 '+money(trade.cash_after_krw)));
    card.append(left,right);list.append(card);
  }
  el('history').replaceChildren(list);el('gain').textContent=money(gains);el('loss').textContent=money(losses);
  el('status').textContent=(rows.length?'청산 '+rows.length+'건':'아직 확정된 청산 기록이 없습니다.')+' · 마지막 수집 '+fmt.format(new Date(paper.updated_at));
}
let busy=false;
async function refresh(){
  if(busy)return;busy=true;
  try{
    const r=await fetch('./trader-discovery/wallet-paper.json?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw Error();const paper=await r.json();
    if(paper.paper_only!==true||paper.real_trading_enabled!==false)throw Error();
    render(paper);
  }catch{el('status').textContent='최신 기록 조회 실패 · 재시도 대기';}finally{busy=false;}
}
refresh();setInterval(refresh,60000);
</script></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><title>BTC 고래 PAPER 추종</title><style>*{box-sizing:border-box}body{background:#0b0f14;color:#edf3fb;font:15px system-ui,-apple-system,sans-serif;margin:0}main{max-width:760px;margin:auto;padding:24px 15px}h1{font-size:24px}a{color:#71c4ff}.sub{color:#9db0c4}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#17212d;border:1px solid #26384a;border-radius:13px;padding:16px;margin:12px 0}.value{font-size:25px;font-weight:700;margin-top:8px}.warn{color:#ffc677}.ok{color:#7ee2a8}button{padding:10px 18px;border:0;border-radius:9px;background:#288dce;color:white;font-weight:700}small{color:#a7bacb}.wallet{padding:10px 0;border-bottom:1px solid #2a3a49}</style></head><body><main><h1>🐋 BTC 고래 PAPER 추종</h1><p class="sub">무료 GitHub 테스트 · 가상매매 전용 · 실거래 불가</p><p><a href="./">BTC 메인</a> · <a href="./whale-intelligence.html">기존 고래 화면</a></p><button onclick="load()">데이터 새로고침</button><p id="status" class="warn">조회 중…</p><div class="grid"><div class="card"><small>가상 평가자산</small><div class="value" id="equity">—</div></div><div class="card"><small>실현 순손익</small><div class="value" id="pnl">—</div></div><div class="card"><small>PAPER 후보 / 검증</small><div class="value" id="counts">—</div></div><div class="card"><small>진행 / 종료 거래</small><div class="value" id="trades">—</div></div></div><div class="card"><h3>고래 실력 선별</h3><p id="ranking">조회 중…</p><div id="wallets"></div></div><div class="card"><h3>진행 중 PAPER 포지션</h3><div id="positions">—</div></div><p class="sub">후보는 과거 공개 표본으로만 고른 테스트 대상입니다. ‘검증’ 표시는 최소 7일·20회 이상의 앞으로 쌓인 관측에서 비용 스트레스 후 수익이 확인된 경우에만 표시합니다.</p><small id="stamp"></small></main><script>
const $=id=>document.getElementById(id),money=n=>Number.isFinite(Number(n))?'$'+Number(n).toFixed(2):'—';
async function get(file){const r=await fetch('./data/'+file+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function load(){
$('status').textContent='조회 중…';const [paper,rank]=await Promise.allSettled([get('whale-paper-state.json'),get('whale-ranking.json')]);
if(paper.status==='fulfilled'){const s=paper.value;$('equity').textContent=money(s.estimated_equity_usd);$('pnl').textContent=money(s.realized_net_pnl_usd);$('counts').textContent=(s.selected_candidate_wallets??0)+' / '+(s.verified_wallets??0);$('trades').textContent=(s.open_positions??0)+' / '+(s.closed_trade_count??0);$('stamp').textContent='PAPER 갱신: '+(s.updated_at||'—');$('positions').innerHTML='';const ps=Object.entries(s.positions||{});if(!ps.length)$('positions').textContent='열린 포지션 없음 — 현재 포지션은 기준점만 잡고 다음 방향 변화부터 복제';for(const [addr,p] of ps){const el=document.createElement('p');el.textContent=addr.slice(0,10)+'… '+p.side+' · 진입 '+money(p.entry_price)+(p.verified_at_entry?' · 검증 고래':' · 후보');$('positions').append(el)}$('status').textContent=s.status==='PAPER_VALIDATING'?'PAPER 후보 추적 중':s.status;}else{$('status').textContent='PAPER 데이터 조회 실패';}
if(rank.status==='fulfilled'){const r=rank.value;$('ranking').textContent='감시 '+(r.watchlist_count??0)+'개 · 후보 '+(r.paper_candidate_count??0)+'개 · 검증 '+(r.verified_count??0)+'개';$('wallets').innerHTML='';for(const w of (r.ranked_wallets||[])){const d=document.createElement('div');d.className='wallet';const tag=w.verified_whale?'검증':w.paper_candidate?'PAPER 후보':'보류';d.textContent=w.address.slice(0,12)+'… | '+tag+' | 과거표본 종료 '+(w.history_sample_closes??0)+'건 | 앞으로 관측 종료 '+(w.forward_closes??0)+'건 | 앞으로 순손익 '+money(w.forward_net_pnl_usd);$('wallets').append(d)}}else{$('ranking').textContent='고래 선별 결과 조회 실패'}
}
load();setInterval(()=>{if(!document.hidden)load()},300000);
</script></body></html>

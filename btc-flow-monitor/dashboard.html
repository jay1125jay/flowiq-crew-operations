<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTC FLOW</title><style>*{box-sizing:border-box}body{margin:0;background:#070b11;color:#edf3fa;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}.app{max-width:1400px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:26px;font-weight:850}.sub,.muted{color:#71859c;font-size:11px}.live{font-size:11px;border:1px solid #244338;border-radius:99px;padding:8px 11px;color:#56dba4}.nav{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:14px 0;background:#070b11}.nav button,.tf{white-space:nowrap;border:1px solid #263649;background:#101823;color:#9fb1c4;border-radius:10px;padding:11px 14px;cursor:pointer}.nav button.active,.tf.active{border-color:#c9a86a;background:#201a10;color:#ead2a0}.page{display:none}.page.active{display:block}.panel{background:linear-gradient(145deg,#101821,#090e15);border:1px solid #1f2c3b;border-radius:16px;margin-bottom:12px;overflow:hidden}.head{padding:16px 18px;border-bottom:1px solid #1b2734}.head h2{margin:0;font-size:16px}.pad{padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.card{background:#0b121a;border:1px solid #1f2d3d;border-radius:12px;padding:14px}.card h3{margin:0 0 10px;font-size:13px}.big{font-size:28px;font-weight:800}.metric{font-size:11px;color:#8fa2b7;line-height:1.8}.green{color:#49dca0}.red{color:#ff7180}.gold{color:#d5b979}.chart{height:620px}.chart iframe{width:100%;height:100%;border:0}.tfs{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{padding:10px;border-bottom:1px solid #1c2937;text-align:left}.mono{font-family:monospace}.notice{padding:12px;color:#a58d61;font-size:10px}.statusline{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid #29394b;border-radius:99px;padding:6px 9px;font-size:10px;color:#9fb0c3}@media(max-width:600px){.app{padding:12px}.brand{font-size:22px}.chart{height:520px}.nav button{padding:10px 12px}.big{font-size:24px}}</style></head><body><main class="app"><header class="top"><div><div class="brand">BTC FLOW</div><div class="sub">고래 · 트레이더 · PAPER 검증 터미널</div></div><div class="live">● PAPER ONLY</div></header><nav class="nav" id="nav"><button class="active" data-page="home">홈</button><button data-page="chart">BTC 차트</button><button data-page="whale">고래 분석</button><button data-page="traders">트레이더 탐색</button><button data-page="scalper">스캘퍼</button><button data-page="swing">스윙</button><button data-page="paper">PAPER 성과</button><button data-page="log">기록</button></nav><section class="page active" id="home"><div class="panel"><div class="head"><h2>시스템 현황</h2></div><div class="pad"><div class="grid" id="homecards"></div><div class="statusline"><span class="chip" id="updated">—</span><span class="chip">실제 주문 없음</span><span class="chip">자동 갱신 60초</span></div></div></div></section><section class="page" id="chart"><div class="panel"><div class="head"><h2>BTC/USDT 실시간 차트</h2><div class="tfs"><button class="tf" data-i="1">1분</button><button class="tf active" data-i="5">5분</button><button class="tf" data-i="15">15분</button><button class="tf" data-i="60">1시간</button></div></div><div class="chart"><iframe id="tv" allowfullscreen></iframe></div></div></section><section class="page" id="whale"><div class="panel"><div class="head"><h2>고래 분석 순위</h2></div><div class="pad"><div class="grid" id="whales"></div></div></div></section><section class="page" id="traders"><div class="panel"><div class="head"><h2>트레이더 탐색 · 6개 유형</h2></div><div class="pad"><div class="grid" id="types"></div><div class="tablewrap"><table class="table"><thead><tr><th>지갑</th><th>유형</th><th>승률</th><th>과거 PnL</th><th>보유시간</th></tr></thead><tbody id="traderrows"></tbody></table></div></div></div></section><section class="page" id="scalper"><div class="panel"><div class="head"><h2>스캘퍼 후보</h2></div><div class="pad"><div class="grid" id="scalpers"></div></div></div></section><section class="page" id="swing"><div class="panel"><div class="head"><h2>스윙 후보</h2></div><div class="pad"><div class="grid" id="swings"></div></div></div></section><section class="page" id="paper"><div class="panel"><div class="head"><h2>6개 유형 독립 PAPER 성과</h2></div><div class="pad"><div class="grid" id="paper6"></div></div></div><div class="panel"><div class="head"><h2>기존 2배 · 5배 · 10배 계좌</h2></div><div class="pad"><div class="grid" id="leverage"></div></div></div></section><section class="page" id="log"><div class="panel"><div class="head"><h2>최근 실행 기록</h2></div><div class="pad" id="events"></div></div><div class="panel"><div class="head"><h2>종료 거래</h2></div><div class="pad" id="trades"></div></div></section><div class="notice">전략 연구용 PAPER 시스템입니다. 실제 주문·입금·출금은 수행하지 않습니다.</div></main><script>const $=id=>document.getElementById(id),usd=n=>n==null?'—':'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2}),num=n=>n==null?'—':Number(n).toLocaleString('ko-KR',{maximumFractionDigits:2}),short=a=>a?a.slice(0,8)+'…'+a.slice(-5):'—',pct=n=>n==null?'—':num(n)+'%',side=s=>({LONG:'롱',SHORT:'숏',FLAT:'관망'}[s]||s||'—');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===b.dataset.page));scrollTo({top:0,behavior:'smooth'})});function chart(i){$('tv').src='https://s.tradingview.com/widgetembed/?symbol=BINANCE%3ABTCUSDT&interval='+i+'&theme=dark&style=1&timezone=Asia%2FSeoul&withdateranges=1&hideideas=1'}document.querySelectorAll('.tf').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tf').forEach(x=>x.classList.toggle('active',x===b));chart(b.dataset.i)});chart(5);async function get(p){const r=await fetch(p+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(p+' '+r.status);return r.json()}function walletCard(w){return '<div class="card"><h3 class="mono">'+short(w.address)+'</h3><div class="metric">유형 '+(w.categories?.join(' · ')||'관찰')+'<br>승률 '+pct(w.history?.win_rate_pct)+' · 종료 '+num(w.history?.closes)+'건<br>과거 PnL '+usd(w.history?.net_pnl_usd)+'<br>중앙 보유 '+(w.holding?.median_seconds==null?'—':num(w.holding.median_seconds/60)+'분')+'</div></div>'}async function load(){try{const [p,r,c,cp]=await Promise.all([get('./data/whale-paper-state.json'),get('./data/whale-ranking.json'),get('./trader-discovery/latest.json'),get('./trader-discovery/category-paper.json')]);const a=p.leverage_accounts||{},ws=c.wallets||[],counts=c.candidate_counts||{};$('homecards').innerHTML='<div class="card"><h3>BTC 기준가격</h3><div class="big gold">'+usd(p.btc_mid_usd)+'</div></div><div class="card"><h3>탐색 누적</h3><div class="big">'+num(c.catalog_wallet_count)+'명</div></div><div class="card"><h3>이번 스캔</h3><div class="big">'+num(c.scanned_this_run)+'명</div></div><div class="card"><h3>API 오류</h3><div class="big">'+num(c.errors?.length||0)+'건</div></div>';$('updated').textContent='최종 동기화 '+new Date(c.generated_at).toLocaleString('ko-KR');$('whales').innerHTML=(r.ranked_wallets||[]).slice(0,12).map((w,i)=>'<div class="card"><h3>#'+(i+1)+' '+short(w.address)+'</h3><div class="big">'+num(w.skill_score)+'</div><div class="metric">승률 '+pct(w.history_sample_win_rate_pct)+' · PF '+num(w.history_profit_factor)+'<br>선행 종료 '+num(w.forward_closes)+'건 · '+side(p.wallets?.[w.address])+'</div></div>').join('')||'<div class="muted">후보 없음</div>';const labels={WHALE:'고래',HIGH_WIN_RATE:'고승률',HIGH_PROFIT:'고수익',CONSISTENT:'안정형',SCALPER:'스캘퍼',SWING:'스윙'};$('types').innerHTML=Object.entries(labels).map(([k,v])=>'<div class="card"><h3>'+v+'</h3><div class="big">'+num(counts[k])+'명</div></div>').join('');$('traderrows').innerHTML=ws.map(w=>'<tr><td class="mono">'+short(w.address)+'</td><td>'+(w.categories?.map(x=>labels[x]||x).join(', ')||'관찰')+'</td><td>'+pct(w.history?.win_rate_pct)+'</td><td>'+usd(w.history?.net_pnl_usd)+'</td><td>'+(w.holding?.median_seconds==null?'—':num(w.holding.median_seconds/60)+'분')+'</td></tr>').join('');$('scalpers').innerHTML=ws.filter(w=>w.category_flags?.SCALPER).map(walletCard).join('')||'<div class="muted">현재 스캘퍼 후보 없음</div>';$('swings').innerHTML=ws.filter(w=>w.category_flags?.SWING).map(walletCard).join('')||'<div class="muted">현재 스윙 후보 없음</div>';const ca=cp.accounts||{};$('paper6').innerHTML=Object.entries(labels).map(([k,v])=>{const x=ca[k]||{};const pnl=(x.equity_usd??1000)-1000;return '<div class="card"><h3>'+v+'</h3><div class="big '+(pnl>0?'green':pnl<0?'red':'')+'">'+usd(x.equity_usd??1000)+'</div><div class="metric">순손익 '+usd(pnl)+' · 승률 '+pct(x.win_rate_pct)+'<br>MDD '+pct(x.mdd_pct)+' · 열린 '+num(x.open_count||0)+' · 종료 '+num(x.closed_count||0)+'<br>관측 '+num(x.eligible_observed||0)+'명</div></div>'}).join('');$('leverage').innerHTML=[2,5,10].map(l=>{const x=a[l]||{};return '<div class="card"><h3>'+l+'배 계좌</h3><div class="big">'+usd(x.estimated_equity_usd??1000)+'</div><div class="metric">실현 '+usd(x.realized_net_pnl_usd)+' · 미실현 '+usd(x.unrealized_pnl_usd)+'<br>보유 '+num(x.open_positions||0)+' · 종료 '+num(x.closed_trade_count||0)+'</div></div>'}).join('');$('events').innerHTML=(p.events_latest||[]).slice().reverse().map(e=>'<div class="card"><b>'+String(e.action||'이벤트')+'</b><div class="metric mono">'+short(e.wallet)+' · '+side(e.from)+' → '+side(e.to||e.direction)+'</div></div>').join('')||'<div class="muted">최근 이벤트 없음</div>';$('trades').innerHTML=[2,5,10].map(l=>'<div class="card"><h3>'+l+'배</h3><div class="metric">'+([...(a[l]?.closed_trades||[])].reverse().slice(0,8).map(t=>short(t.wallet)+' · '+side(t.side)+' · '+usd(t.net_pnl_usd)).join('<br>')||'종료 거래 없음')+'</div></div>').join('')}catch(e){$('homecards').innerHTML='<div class="card red">데이터 로드 오류: '+e.message+'</div>'}}load();setInterval(load,60000)</script></body></html>

name: BTC whale + trader cohorts + adaptive PAPER
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'btc-flow-monitor/**'
      - '.github/workflows/btc-whale-skill-screen.yml'
permissions:
  contents: write
concurrency:
  group: btc-whale-screen-and-paper
  cancel-in-progress: false
jobs:
  screen_and_simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify PAPER engines offline
        run: |
          python -m unittest discover -s btc-flow-monitor/scripts -p 'test_whale_paper.py' -v
          python -m unittest discover -s btc-flow-monitor/trader-discovery -p 'test_trader_discovery.py' -v
          python -m unittest discover -s btc-flow-monitor/trader-discovery -p 'test_category_paper.py' -v
          python -m unittest discover -s btc-flow-monitor -p 'test_adaptive_meta.py' -v
      - name: Integrate dashboard
        run: python btc-flow-monitor/integrate-follow.py
      - name: Refresh trader pool
        run: python btc-flow-monitor/trader-discovery/leaderboard_expand.py
      - name: Screen BTC traders
        run: python btc-flow-monitor/scripts/whale_ranker.py
      - name: Classify cohorts
        run: python btc-flow-monitor/trader-discovery/trader_discovery.py
      - name: Observe positions
        run: python btc-flow-monitor/trader-discovery/current_positions.py
      - name: Run control whale PAPER
        run: python btc-flow-monitor/scripts/whale_paper_follow.py
      - name: Run cohort PAPER
        run: python btc-flow-monitor/trader-discovery/category_paper.py
      - name: Run adaptive multi-engine PAPER
        run: python btc-flow-monitor/adaptive_meta.py
      - name: Validate safety
        run: |
          python - <<'PY'
          import json,pathlib
          b=pathlib.Path('btc-flow-monitor')
          p=json.loads((b/'trader-discovery/category-paper.json').read_text())
          m=json.loads((b/'data/adaptive-meta.json').read_text())
          assert p['paper_only'] is True and p['real_trading_enabled'] is False and p['schema_version']==6
          assert m['paper_only'] is True and m['real_trading_enabled'] is False
          assert m['schema_version']==1 and 'ADAPTIVE_META' in m['decisions'] and 'WHALE_COPY' in m['decisions']
          print('BTC FLOW ADAPTIVE VALIDATION PASS')
          PY
      - name: Persist validated research state
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add btc-flow-monitor/dashboard.html btc-flow-monitor/data btc-flow-monitor/trader-discovery/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: rotate validated BTC adaptive research'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: BTC whale + trader cohorts + copy PAPER (PAPER only)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'btc-flow-monitor/scripts/whale_ranker.py'
      - 'btc-flow-monitor/scripts/whale_paper_follow.py'
      - 'btc-flow-monitor/scripts/test_whale_paper.py'
      - 'btc-flow-monitor/trader-discovery/**'
      - 'btc-flow-monitor/data/whale-watchlist.json'
      - '.github/workflows/btc-whale-skill-screen.yml'
permissions:
  contents: write
concurrency:
  group: btc-whale-screen-and-paper
  cancel-in-progress: false
jobs:
  screen_and_simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify PAPER engines offline
        run: |
          python -m unittest discover -s btc-flow-monitor/scripts -p 'test_whale_paper.py' -v
          python -m unittest discover -s btc-flow-monitor/trader-discovery -p 'test_trader_discovery.py' -v
          python -m unittest discover -s btc-flow-monitor/trader-discovery -p 'test_category_paper.py' -v
      - name: Refresh diversified public trader pool
        run: |
          for i in 1 2 3; do
            python btc-flow-monitor/trader-discovery/leaderboard_expand.py && break
            test "$i" -eq 3 && exit 1
            sleep 15
          done
      - name: Screen rotating BTC trader batch within API budget
        run: |
          for i in 1 2 3; do
            python btc-flow-monitor/scripts/whale_ranker.py && break
            test "$i" -eq 3 && exit 1
            sleep 15
          done
      - name: Classify and accumulate six trader research cohorts
        run: |
          for i in 1 2 3; do
            python btc-flow-monitor/trader-discovery/trader_discovery.py && break
            test "$i" -eq 3 && exit 1
            sleep 15
          done
      - name: Run wallet copy simulation (no real orders)
        run: |
          for i in 1 2 3; do
            python btc-flow-monitor/scripts/whale_paper_follow.py && break
            test "$i" -eq 3 && exit 1
            sleep 15
          done
      - name: Update six independent PAPER category accounts
        run: python btc-flow-monitor/trader-discovery/category_paper.py
      - name: Persist expanded pool, ranking, cohorts, observations, and PAPER state atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc-flow-monitor/trader-discovery/category-paper.json btc-flow-monitor/trader-discovery/candidate-pool.json btc-flow-monitor/trader-discovery/latest.json btc-flow-monitor/data/whale-ranking.json btc-flow-monitor/data/whale-observations.json btc-flow-monitor/data/whale-paper-state.json
          if ! git diff --cached --quiet; then
            git commit -m "data: rotate expanded BTC trader cohort research"
            git pull --rebase -X ours origin main
            git push origin HEAD:main
          fi

name: BTC whale + trader cohorts + adaptive PAPER
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'btc-flow-monitor/**/*.py'
      - 'btc-flow-monitor/**/*.html'
      - 'btc-flow-monitor/**/*.js'
      - 'btc-flow-monitor/**/*.md'
      - 'btc-flow-monitor/**/*.cmd'
      - 'btc-flow-monitor/**/*.ps1'
      - 'btc-flow-monitor/**/*.txt'
      - 'btc-flow-monitor/**/*.webmanifest'
      - 'btc-flow-monitor/**/requirements.txt'
      - '.github/workflows/btc-whale-skill-screen.yml'
permissions:
  contents: write
concurrency:
  group: btc-whale-screen-and-paper
  cancel-in-progress: false
jobs:
  screen_and_simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify PAPER engines offline
        if: github.event_name != 'schedule'
        run: |
          python -m unittest discover -s btc-flow-monitor/scripts -p 'test_whale_paper.py' -v
          python -m unittest discover -s btc-flow-monitor/trader-discovery -p 'test_trader_discovery.py' -v
          python -m unittest discover -s btc-flow-monitor/trader-discovery -p 'test_category_paper.py' -v
          python -m unittest discover -s btc-flow-monitor -p 'test_*.py' -v
      - name: Integrate dashboard
        if: github.event_name != 'schedule'
        run: python btc-flow-monitor/integrate-follow.py
      - name: Refresh trader pool
        run: python btc-flow-monitor/trader-discovery/leaderboard_expand.py
      - name: Screen BTC traders
        run: python btc-flow-monitor/scripts/whale_ranker.py
      - name: Classify cohorts
        run: python btc-flow-monitor/trader-discovery/trader_discovery.py
      - name: Collect public derivatives and closed candles
        run: python btc-flow-monitor/collect_adaptive_market.py
      - name: Observe positions
        run: python btc-flow-monitor/trader-discovery/current_positions.py
      - name: Record cloud replay event
        run: python btc-flow-monitor/cloud_replay_log.py
      - name: Validate input freshness and complete feeds
        run: python btc-flow-monitor/validate_research.py
      - name: Run control whale PAPER
        run: python btc-flow-monitor/scripts/whale_paper_follow.py
      - name: Run cohort PAPER TOP6
        run: python btc-flow-monitor/category_top6_cloud.py
      - name: Run adaptive PAPER competition
        run: python btc-flow-monitor/adaptive_run.py
      - name: Build compact engine health and profit-source status
        run: python btc-flow-monitor/scripts/build_engine_status.py
      - name: Validate safety and competition
        run: python btc-flow-monitor/validate_research.py --outputs
      - name: Persist validated research state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          # The capture worker writes current positions AND the category PAPER
          # ledger. A conventional git rebase would conflict on these JSON files.
          # Recompute against the latest authoritative ledger on every retry.
          # Never resolve conflicts with "ours", force-push, or reset capital.
          for attempt in 1 2 3 4 5; do
            echo "PAPER_PERSIST_ATTEMPT=$attempt"
            git fetch origin main
            git reset --hard origin/main
            python btc-flow-monitor/trader-discovery/leaderboard_expand.py
            python btc-flow-monitor/scripts/whale_ranker.py
            python btc-flow-monitor/trader-discovery/trader_discovery.py
            python btc-flow-monitor/collect_adaptive_market.py
            python btc-flow-monitor/trader-discovery/current_positions.py
            python btc-flow-monitor/cloud_replay_log.py
            python btc-flow-monitor/validate_research.py
            python btc-flow-monitor/scripts/whale_paper_follow.py
            python btc-flow-monitor/category_top6_cloud.py
            python btc-flow-monitor/adaptive_run.py
            python btc-flow-monitor/scripts/build_engine_status.py
            python btc-flow-monitor/validate_research.py --outputs
            git add btc-flow-monitor/dashboard.html btc-flow-monitor/data/*.json btc-flow-monitor/trader-discovery/*.json
            if git diff --cached --quiet; then
              echo "PAPER_PERSIST_NO_CHANGE"
              exit 0
            fi
            git commit -m "data: persist validated BTC PAPER competition"
            if git push origin HEAD:main; then
              echo "PAPER_PERSIST_PASS recomputed_from_latest_main=true"
              exit 0
            fi
            # A concurrent capture won the race; replay on newest ledger.
            sleep "$((attempt * 2))"
          done
          echo "PAPER_PERSIST_FAIL conflict_retries_exhausted=5"
          exit 1

  dashboard_check:
    if: github.event_name != 'schedule'
    needs: screen_and_simulate
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Verify desktop and mobile dashboard
        run: |
          python btc-flow-monitor/verify_dashboard.py
          python btc-flow-monitor/verify_realtime_browser.py
          python btc-flow-monitor/verify_phone_browser.py
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-dashboard-browser-evidence
          path: btc-flow-monitor/browser-evidence/
          retention-days: 7

  realtime_check:
    if: github.event_name != 'schedule'
    needs: screen_and_simulate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PAPER_ONLY: 'true'
      REAL_TRADING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install public stream client
        run: python -m pip install -r btc-flow-monitor/realtime/requirements.txt
      - name: Verify bounded realtime PAPER loop
        run: python btc-flow-monitor/verify_realtime_live.py
      - name: Preserve realtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-realtime-evidence
          path: btc-flow-monitor/browser-evidence/realtime-live.json
          retention-days: 7

  windows_check:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PAPER_ONLY: 'true'
      REAL_TRADING: 'false'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install stream client on Windows
        run: python -m pip install -r btc-flow-monitor/realtime/requirements.txt
      - name: Verify Windows locks, restart and PAPER accounting
        run: python -m unittest discover -s btc-flow-monitor -p 'test_*.py' -v
      - name: Verify Windows public stream and six accounts
        run: python btc-flow-monitor/verify_realtime_live.py
      - name: Verify authenticated public phone connection
        run: python btc-flow-monitor/verify_phone_live.py
      - name: Package Windows launcher and BTC-only files
        shell: pwsh
        run: |
          Get-ChildItem btc-flow-monitor -Directory -Recurse -Filter __pycache__ | Remove-Item -Recurse -Force
          Remove-Item btc-flow-monitor/browser-evidence -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path btc-flow-monitor -DestinationPath BTC_FLOW_WINDOWS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BTC_FLOW_WINDOWS
          path: BTC_FLOW_WINDOWS.zip
          retention-days: 30

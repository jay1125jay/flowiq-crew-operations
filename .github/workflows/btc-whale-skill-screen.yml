name: BTC whale + trader cohorts + copy PAPER (PAPER only)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'btc-flow-monitor/scripts/whale_ranker.py'
      - 'btc-flow-monitor/scripts/whale_paper_follow.py'
      - 'btc-flow-monitor/scripts/test_whale_paper.py'
      - 'btc-flow-monitor/trader-discovery/**'
      - 'btc-flow-monitor/dashboard-follow.js'
      - 'btc-flow-monitor/integrate-follow.py'
      - 'btc-flow-monitor/data/whale-watchlist.json'
      - '.github/workflows/btc-whale-skill-screen.yml'
permissions:
  contents: write
concurrency:
  group: btc-whale-screen-and-paper
  cancel-in-progress: false
jobs:
  screen_and_simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify PAPER engines offline
        run: |
          python -m unittest discover -s btc-flow-monitor/scripts -p 'test_whale_paper.py' -v
          python -m unittest discover -s btc-flow-monitor/trader-discovery -p 'test_trader_discovery.py' -v
          python -m unittest discover -s btc-flow-monitor/trader-discovery -p 'test_category_paper.py' -v
      - name: Integrate follower panel safely
        run: python btc-flow-monitor/integrate-follow.py
      - name: Refresh diversified public trader pool
        run: |
          for i in 1 2 3; do python btc-flow-monitor/trader-discovery/leaderboard_expand.py && break; test "$i" -eq 3 && exit 1; sleep 15; done
      - name: Screen rotating BTC trader batch
        run: |
          for i in 1 2 3; do python btc-flow-monitor/scripts/whale_ranker.py && break; test "$i" -eq 3 && exit 1; sleep 15; done
      - name: Classify six trader cohorts
        run: |
          for i in 1 2 3; do python btc-flow-monitor/trader-discovery/trader_discovery.py && break; test "$i" -eq 3 && exit 1; sleep 15; done
      - name: Observe current BTC positions
        run: |
          for i in 1 2 3; do python btc-flow-monitor/trader-discovery/current_positions.py && break; test "$i" -eq 3 && exit 1; sleep 15; done
      - name: Run legacy whale PAPER simulation
        run: |
          for i in 1 2 3; do python btc-flow-monitor/scripts/whale_paper_follow.py && break; test "$i" -eq 3 && exit 1; sleep 15; done
      - name: Update 12 independent 5X and 10X PAPER cohort accounts
        run: python btc-flow-monitor/trader-discovery/category_paper.py
      - name: Validate feed freshness and PAPER safety before persistence
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          base=pathlib.Path('btc-flow-monitor/trader-discovery')
          feed=json.loads((base/'current-positions.json').read_text())
          paper=json.loads((base/'category-paper.json').read_text())
          assert feed.get('paper_only') is True, 'feed PAPER flag'
          assert feed.get('real_trading_enabled') is False, 'feed live flag'
          assert paper.get('paper_only') is True, 'paper PAPER flag'
          assert paper.get('real_trading_enabled') is False, 'paper live flag'
          assert paper.get('schema_version') == 5, paper.get('schema_version')
          assert paper.get('leverages') == [5,10]
          assert paper.get('account_count') == 12
          accounts=paper.get('accounts',{})
          assert len(accounts) == 12, len(accounts)
          assert paper.get('feed_errors',999999) == 0, paper.get('feed_errors')
          assert feed.get('observed_wallet_count',0) > 0
          assert feed.get('observed_wallet_count') == paper.get('observed_wallet_count')
          for key,a in accounts.items():
            assert key.endswith(('_5X','_10X')), key
            assert a.get('leverage') in (5,10), key
            assert isinstance(a.get('pending_reversals',{}),dict), key
            for pos in a.get('positions',{}).values():
              assert pos.get('leverage') == a['leverage']
              assert pos.get('margin_usd') == 150.0
              assert pos.get('notional_usd') == 150.0*a['leverage']
              assert pos.get('liquidation_price',0) > 0
          stamp=feed.get('generated_at') or feed.get('updated_at')
          assert stamp, 'missing feed timestamp'
          ts=datetime.datetime.fromisoformat(stamp.replace('Z','+00:00'))
          age=(datetime.datetime.now(datetime.timezone.utc)-ts).total_seconds()
          assert -60 <= age <= 180, f'feed stale age={age:.1f}s'
          print(f'BTC FLOW VALIDATION PASS schema=5 accounts=12 observed={feed.get("observed_wallet_count")} age={age:.1f}s')
          PY
      - name: Persist validated research state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc-flow-monitor/dashboard.html btc-flow-monitor/trader-discovery/category-paper.json btc-flow-monitor/trader-discovery/current-positions.json btc-flow-monitor/trader-discovery/candidate-pool.json btc-flow-monitor/trader-discovery/latest.json btc-flow-monitor/data/whale-ranking.json btc-flow-monitor/data/whale-observations.json btc-flow-monitor/data/whale-paper-state.json
          if ! git diff --cached --quiet; then
            git commit -m "data: rotate validated BTC trader cohort research"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              git rebase --abort || true
              sleep $((i*5))
            done
            exit 1
          fi

name: BTC whale screening + copy PAPER (PAPER only)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'btc-flow-monitor/scripts/whale_ranker.py'
      - 'btc-flow-monitor/scripts/whale_paper_follow.py'\n      - 'btc-flow-monitor/scripts/test_whale_paper.py'
      - 'btc-flow-monitor/data/whale-watchlist.json'
      - '.github/workflows/btc-whale-skill-screen.yml'
permissions:
  contents: write
concurrency:
  group: btc-whale-screen-and-paper
  cancel-in-progress: false
jobs:
  screen_and_simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify PAPER engine with isolated offline trade lifecycle\n        run: python -m unittest discover -s btc-flow-monitor/scripts -p 'test_whale_paper.py' -v\n      - name: Screen tracked public BTC whale wallets
        run: |
          for i in 1 2 3; do
            python btc-flow-monitor/scripts/whale_ranker.py && break
            test "$i" -eq 3 && exit 1
            sleep 10
          done
      - name: Run wallet copy simulation (no real orders)
        run: |
          for i in 1 2 3; do
            python btc-flow-monitor/scripts/whale_paper_follow.py && break
            test "$i" -eq 3 && exit 1
            sleep 10
          done
      - name: Persist ranking, forward observations, and PAPER state atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc-flow-monitor/data/whale-ranking.json btc-flow-monitor/data/whale-observations.json btc-flow-monitor/data/whale-paper-state.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update whale screening and copy PAPER state"
            git pull --rebase
            git push
          fi

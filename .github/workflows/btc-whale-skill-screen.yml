name: BTC whale skill screening (PAPER only)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: btc-whale-skill-screen
  cancel-in-progress: false
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Screen tracked public BTC whale wallets
        run: python btc-flow-monitor/scripts/whale_ranker.py
      - name: Publish ranking snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc-flow-monitor/data/whale-ranking.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update BTC whale skill ranking"
            git pull --rebase
            git push
          fi

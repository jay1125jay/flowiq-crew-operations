name: BTC whale + trader cohorts + adaptive PAPER
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'btc-flow-monitor/**'
      - '.github/workflows/btc-whale-skill-screen.yml'
permissions:
  contents: write
concurrency:
  group: btc-whale-screen-and-paper
  cancel-in-progress: false
jobs:
  screen_and_simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify PAPER engines offline
        run: |
          python -m unittest discover -s btc-flow-monitor/scripts -p 'test_whale_paper.py' -v
          python -m unittest discover -s btc-flow-monitor/trader-discovery -p 'test_trader_discovery.py' -v
          python -m unittest discover -s btc-flow-monitor/trader-discovery -p 'test_category_paper.py' -v
          python -m unittest discover -s btc-flow-monitor -p 'test_*.py' -v
      - name: Integrate dashboard
        run: python btc-flow-monitor/integrate-follow.py
      - name: Refresh trader pool
        run: python btc-flow-monitor/trader-discovery/leaderboard_expand.py
      - name: Screen BTC traders
        run: python btc-flow-monitor/scripts/whale_ranker.py
      - name: Classify cohorts
        run: python btc-flow-monitor/trader-discovery/trader_discovery.py
      - name: Collect public derivatives and closed candles
        run: python btc-flow-monitor/collect_adaptive_market.py
      - name: Observe positions
        run: python btc-flow-monitor/trader-discovery/current_positions.py
      - name: Validate input freshness and complete feeds
        run: python btc-flow-monitor/validate_research.py
      - name: Run control whale PAPER
        run: python btc-flow-monitor/scripts/whale_paper_follow.py
      - name: Run cohort PAPER
        run: python btc-flow-monitor/trader-discovery/category_paper.py
      - name: Run adaptive PAPER competition
        run: python btc-flow-monitor/adaptive_run.py
      - name: Validate safety and competition
        run: python btc-flow-monitor/validate_research.py --outputs
      - name: Persist validated research state
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add btc-flow-monitor/dashboard.html btc-flow-monitor/data/*.json btc-flow-monitor/trader-discovery/*.json
          python btc-flow-monitor/persist_research.py

  dashboard_check:
    needs: screen_and_simulate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Verify desktop and mobile dashboard
        run: |
          python btc-flow-monitor/verify_dashboard.py
          python btc-flow-monitor/verify_realtime_browser.py
          python btc-flow-monitor/verify_phone_browser.py
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-dashboard-browser-evidence
          path: btc-flow-monitor/browser-evidence/
          retention-days: 7

  realtime_check:
    if: github.event_name != 'schedule'
    needs: screen_and_simulate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PAPER_ONLY: 'true'
      REAL_TRADING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install public stream client
        run: python -m pip install -r btc-flow-monitor/realtime/requirements.txt
      - name: Verify bounded realtime PAPER loop
        run: python btc-flow-monitor/verify_realtime_live.py
      - name: Preserve realtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-realtime-evidence
          path: btc-flow-monitor/browser-evidence/realtime-live.json
          retention-days: 7

  windows_check:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PAPER_ONLY: 'true'
      REAL_TRADING: 'false'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install stream client on Windows
        run: python -m pip install -r btc-flow-monitor/realtime/requirements.txt
      - name: Verify Windows locks, restart and PAPER accounting
        run: python -m unittest discover -s btc-flow-monitor -p 'test_*.py' -v
      - name: Verify Windows public stream and six accounts
        run: python btc-flow-monitor/verify_realtime_live.py
      - name: Verify authenticated public phone connection
        run: python btc-flow-monitor/verify_phone_live.py
      - name: Package Windows launcher and BTC-only files
        shell: pwsh
        run: |
          Get-ChildItem btc-flow-monitor -Directory -Recurse -Filter __pycache__ | Remove-Item -Recurse -Force
          Remove-Item btc-flow-monitor/browser-evidence -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path btc-flow-monitor -DestinationPath BTC_FLOW_WINDOWS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BTC_FLOW_WINDOWS
          path: BTC_FLOW_WINDOWS.zip
          retention-days: 30

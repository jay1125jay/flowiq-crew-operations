name: BTC public PAPER snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '1-59/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'btc-flow-monitor/scripts/public_market_snapshot.py'
      - '.github/workflows/btc-public-paper-snapshot.yml'
permissions:
  contents: write
concurrency:
  group: btc-public-paper-snapshot
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public market snapshot (no orders)
        run: python btc-flow-monitor/scripts/public_market_snapshot.py
      - name: Publish validated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc-flow-monitor/data/public-market.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public BTC PAPER snapshot"
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "push race detected; rebasing attempt ${attempt}/4"
              git pull --rebase origin main
              sleep 2
            done
            echo "snapshot publish failed after retries"
            exit 1
          fi

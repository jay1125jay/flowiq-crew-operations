name: kcycle-route-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kcycle-route-probe.yml'
      - 'race-sports/tools/kcycle_result_route_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe KCYCLE result route
        run: python race-sports/tools/kcycle_result_route_probe.py

name: raceiq-fast-results

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raceiq-fast-results.yml'
      - 'race-sports/.fast-results-trigger'
      - 'race-sports/data/today.json'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: raceiq-fast-results
  cancel-in-progress: true

jobs:
  refresh-results:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preserve current snapshot
        shell: bash
        run: |
          set -euo pipefail
          cp race-sports/data/today.json /tmp/raceiq-fast-before.json

      - name: Refresh only active racing results
        shell: bash
        run: |
          set -euo pipefail

          HAS_HORSE=$(python - <<'PY'
          import json
          d=json.load(open('race-sports/data/today.json',encoding='utf-8'))
          print('1' if any(e.get('sport')=='HORSE' and e.get('status')!='FINAL' for e in d.get('events',[])) else '0')
          PY
          )
          HAS_CYCLE=$(python - <<'PY'
          import json
          d=json.load(open('race-sports/data/today.json',encoding='utf-8'))
          print('1' if any(e.get('sport')=='CYCLE' and e.get('status')!='FINAL' for e in d.get('events',[])) else '0')
          PY
          )
          HAS_BULL=$(python - <<'PY'
          import json
          d=json.load(open('race-sports/data/today.json',encoding='utf-8'))
          print('1' if any(e.get('sport')=='BULL' and e.get('status')!='FINAL' for e in d.get('events',[])) else '0')
          PY
          )
          HAS_BOAT=$(python - <<'PY'
          import json
          d=json.load(open('race-sports/data/today.json',encoding='utf-8'))
          print('1' if any(e.get('sport')=='BOAT' and e.get('status')!='FINAL' for e in d.get('events',[])) else '0')
          PY
          )

          echo "FAST_ACTIVE horse=$HAS_HORSE cycle=$HAS_CYCLE boat=$HAS_BOAT bull=$HAS_BULL"

          if [ "$HAS_HORSE" = "1" ]; then
            timeout 45s python race-sports/tools/kra_official_enricher.py || echo 'FAST_KRA_RESULT_REFRESH=DEGRADED'
          fi

          if [ "$HAS_CYCLE" = "1" ]; then
            timeout 45s python race-sports/tools/kcycle_official_enricher.py || echo 'FAST_KCYCLE_RESULT_REFRESH=DEGRADED'
          fi

          if [ "$HAS_BULL" = "1" ]; then
            timeout 45s python race-sports/tools/bull_official_enricher.py || echo 'FAST_BULL_RESULT_REFRESH=DEGRADED'
          fi

          if [ "$HAS_BOAT" = "1" ]; then
            cp race-sports/data/today.json /tmp/raceiq-pre-kboat.json
            if ! timeout 60s python race-sports/tools/racing_static_collector.py; then
              echo 'FAST_KBOAT_RESULT_REFRESH=DEGRADED'
              cp /tmp/raceiq-pre-kboat.json race-sports/data/today.json
            fi
          fi

      - name: Validate result snapshot
        shell: bash
        run: |
          set -euo pipefail
          python race-sports/tools/validate_snapshot.py race-sports/data/today.json

      - name: Publish result changes conflict-safe
        shell: bash
        run: |
          set -euo pipefail

          cp race-sports/data/today.json /tmp/raceiq-fast-after.json
          DATE=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/raceiq-fast-after.json',encoding='utf-8'))['date'])
          PY
          )

          python - <<'PY'
          import json
          from pathlib import Path

          def projection(path):
              d=json.loads(Path(path).read_text(encoding='utf-8'))
              rows=[]
              for e in d.get('events',[]):
                  rows.append({
                      'id':e.get('id'),
                      'status':e.get('status'),
                      'result':e.get('result'),
                      'outcomes':e.get('outcomes'),
                  })
              return rows

          a=projection('/tmp/raceiq-fast-before.json')
          b=projection('/tmp/raceiq-fast-after.json')
          Path('/tmp/raceiq-fast-changed').write_text('1' if a!=b else '0')
          print('FAST_RESULT_CHANGED=' + ('1' if a!=b else '0'))
          PY

          if [ "$(cat /tmp/raceiq-fast-changed)" != "1" ]; then
            echo 'FAST_RESULT_PUBLISH=NO_CHANGE'
            exit 0
          fi

          git config user.name "race-sports-result-bot"
          git config user.email "actions@users.noreply.github.com"

          for n in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            # Apply only fields changed by the fast result refresh onto the
            # newest main snapshot. Never replace the whole file with the
            # checkout-time copy because that can roll back newer odds/model data.
            python - <<'PY'
          import json
          from copy import deepcopy
          from pathlib import Path

          before=json.loads(Path('/tmp/raceiq-fast-before.json').read_text(encoding='utf-8'))
          after=json.loads(Path('/tmp/raceiq-fast-after.json').read_text(encoding='utf-8'))
          target_path=Path('race-sports/data/today.json')
          latest=json.loads(target_path.read_text(encoding='utf-8'))

          before_events={e.get('id'):e for e in before.get('events',[]) if e.get('id')}
          after_events={e.get('id'):e for e in after.get('events',[]) if e.get('id')}
          latest_events={e.get('id'):e for e in latest.get('events',[]) if e.get('id')}

          def outcome_key(o):
              if o.get('key') is not None:return ('key',str(o.get('key')))
              if o.get('number') is not None:return ('number',str(o.get('number')))
              return ('name',str(o.get('name') or ''))

          touched=0
          for eid,a in after_events.items():
              b=before_events.get(eid)
              if b is None:
                  if eid not in latest_events:
                      latest.setdefault('events',[]).append(deepcopy(a))
                      latest_events[eid]=latest['events'][-1]
                      touched+=1
                  continue
              t=latest_events.get(eid)
              if t is None:
                  latest.setdefault('events',[]).append(deepcopy(a))
                  latest_events[eid]=latest['events'][-1]
                  touched+=1
                  continue

              for field in ('status','result'):
                  if a.get(field)!=b.get(field):
                      t[field]=deepcopy(a.get(field))
                      touched+=1

              b_out={outcome_key(o):o for o in (b.get('outcomes') or [])}
              t_out={outcome_key(o):o for o in (t.get('outcomes') or [])}
              for ao in (a.get('outcomes') or []):
                  key=outcome_key(ao)
                  bo=b_out.get(key,{})
                  to=t_out.get(key)
                  if to is None:
                      t.setdefault('outcomes',[]).append(deepcopy(ao))
                      t_out[key]=t['outcomes'][-1]
                      touched+=1
                      continue
                  for k,v in ao.items():
                      if bo.get(k)!=v:
                          to[k]=deepcopy(v)
                          touched+=1

          before_providers={p.get('provider'):p for p in before.get('providers',[]) if p.get('provider')}
          after_providers={p.get('provider'):p for p in after.get('providers',[]) if p.get('provider')}
          latest_providers={p.get('provider'):p for p in latest.get('providers',[]) if p.get('provider')}
          for name,a in after_providers.items():
              b=before_providers.get(name)
              if b is None:
                  if name not in latest_providers:
                      latest.setdefault('providers',[]).append(deepcopy(a));touched+=1
                  continue
              t=latest_providers.get(name)
              if t is None:
                  latest.setdefault('providers',[]).append(deepcopy(a));touched+=1
                  continue
              for k,v in a.items():
                  if b.get(k)!=v:
                      t[k]=deepcopy(v);touched+=1

          target_path.write_text(json.dumps(latest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'FAST_RESULT_DELTA_MERGE=PASS touched={touched}')
          PY

            python race-sports/tools/validate_snapshot.py race-sports/data/today.json
            mkdir -p race-sports/data/history
            cp race-sports/data/today.json "race-sports/data/history/${DATE}.json"
            git add race-sports/data/today.json "race-sports/data/history/${DATE}.json"

            if git diff --cached --quiet; then
              echo 'FAST_RESULT_PUBLISH=NO_DIFF_AFTER_REBASE'
              exit 0
            fi

            git commit -m "chore: refresh RACEIQ race results"
            if git push origin HEAD:main; then
              echo 'FAST_RESULT_PUBLISH=PASS'
              exit 0
            fi
            echo "FAST_RESULT_PUSH_CONFLICT=$n/5"
          done

          echo 'FAST_RESULT_PUBLISH=FAIL'
          exit 1

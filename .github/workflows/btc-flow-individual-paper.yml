name: BTC FLOW individual whale PAPER
on:
  push:
    branches: [main]
    paths: [btc-flow-monitor/wallet_paper.py, btc-flow-monitor/publish_wallet_paper.py, .github/workflows/btc-flow-individual-paper.yml]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-flow-individual-whale-paper
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Observe public positions and persist paper ledgers
        run: python btc-flow-monitor/publish_wallet_paper.py

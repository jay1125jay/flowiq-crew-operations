name: raceiq-kovo-legacy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raceiq-kovo-legacy.yml'
      - 'race-sports/tools/kovo_legacy_pdf_backfill.py'
      - 'race-sports/tools/kovo_official_pdf_backfill.py'

permissions:
  contents: write

concurrency:
  group: raceiq-kovo-legacy
  cancel-in-progress: true

jobs:
  legacy-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Verify legacy filename fallback
        run: python race-sports/tools/kovo_legacy_pdf_backfill.py --self-test

      - name: Backfill KOVO legacy season 014
        run: python race-sports/tools/kovo_legacy_pdf_backfill.py --seasons 014 --max-game 260 --workers 6

      - name: Rebuild and validate SPORTS model
        run: |
          python race-sports/tools/inject_sports_model.py
          python race-sports/tools/validate_sports_snapshot.py race-sports/data/sports_today.json

      - name: Publish legacy KOVO outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "raceiq-kovo-legacy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add race-sports/data/sports_history
          git add race-sports/data/historical_state/kovo_pdf_backfill_state.json
          git add race-sports/data/model_state/sports_elo_v0.2.validation.json
          if git diff --cached --quiet; then
            echo "KOVO_LEGACY_NO_CHANGE=PASS"
            exit 0
          fi
          git commit -m "chore: extend official KOVO legacy history"
          git pull --rebase origin main
          git push origin HEAD:main

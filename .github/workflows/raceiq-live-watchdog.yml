name: raceiq-live-watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raceiq-live-watchdog.yml'
  schedule:
    # Redundant half-hour anchors. Each run dispatches the full RACEIQ refresh
    # every 5 minutes for 60 minutes, avoiding gaps when GitHub cron is delayed.
    - cron: '7,37 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: raceiq-live-watchdog
  cancel-in-progress: false

jobs:
  dispatch-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - name: Dispatch RACEIQ refresh every 5 minutes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "RACEIQ_WATCHDOG_SMOKE=1"
            gh workflow run race-sports-static-refresh.yml --ref main
            exit 0
          fi
          for n in $(seq 1 12); do
            echo "RACEIQ_REFRESH_DISPATCH=$n/12"
            gh workflow run race-sports-static-refresh.yml --ref main
            if [ "$n" -lt 12 ]; then
              sleep 300
            fi
          done

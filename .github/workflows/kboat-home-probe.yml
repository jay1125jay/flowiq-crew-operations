name: kboat-home-probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kboat-home-probe.yml'
      - 'race-sports/tools/kboat_home_probe.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python race-sports/tools/kboat_home_probe.py

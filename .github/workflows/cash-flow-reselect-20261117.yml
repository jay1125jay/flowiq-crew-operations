name: Cash Flow one-time PAPER whale selection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cash-flow-reselect-20261117.yml']
permissions:
  contents: write
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify three active replacements
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          import pathlib
          import time
          import urllib.request
          
          root = pathlib.Path("btc-flow-monitor/trader-discovery")
          target = root / "selected-whales.json"
          selected = json.loads(target.read_text())
          expected = ["0x469e9a7f624b04c24f0e64edf8d8a277e6bf58a5","0xfc27136e42af1732ddc9ce2605ea9bff1b959d9d","0xbf49647d017805fcc576ac10f33a788e636f4258","0x4e14fc11f58b64740e66e4b1aa188a4b007c0eab","0xe867fbdad3291530e41530301ecb77693850c78e"]
          assert [row["address"] for row in selected] == expected
          ledger = json.loads((root / "wallet-paper.json").read_text())
          assert ledger["paper_only"] and not ledger["real_trading_enabled"]
          assert all(not ledger["accounts"][addr]["position"] for addr in expected[2:])
          def read(url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=12) as response:
                          return json.load(response)
                  except OSError:
                      if attempt == 2:
                          raise
                      time.sleep(2 ** attempt)
          api = "https://api.hyperliquid.xyz/info"
          leaders = read("https://stats-data.hyperliquid.xyz/Mainnet/leaderboard")["leaderboardRows"]
          def pnl(row):
              window = dict(row["windowPerformances"])
              return float(window["allTime"]["pnl"])
          leaders = sorted((r for r in leaders if float(r["accountValue"]) > 0 and pnl(r) > 0 and r["ethAddress"].lower() not in expected), key=pnl, reverse=True)
          start = int(time.time()*1000) - 86400000
          winners = []
          for row in leaders[:500]:
              addr = row["ethAddress"].lower()
              fills = read(api, {"type":"userFillsByTime","user":addr,"startTime":start})
              btc = [f for f in fills if f["coin"] == "BTC" and int(f["time"]) >= start]
              if not btc:
                  time.sleep(.35)
                  continue
              state = read(api, {"type":"clearinghouseState","user":addr})
              equity = float(state["marginSummary"]["accountValue"])
              if not math.isfinite(equity) or equity <= 0:
                  continue
              winners.append(dict(address=addr,net_pnl_usd=round(pnl(row),2),pnl_basis="leaderboard_all_time_account",source_equity_usd=equity,last_btc_fill_ms=max(int(f["time"]) for f in btc)))
              if len(winners) == 3:
                  break
          if len(winners) != 3:
              raise SystemExit("Insufficient verified replacements")
          target.write_text(json.dumps(selected[:2]+winners,indent=2)+"\n")
          PY
          git add -- btc-flow-monitor/trader-discovery/selected-whales.json
          git -c user.name="Cash Flow PAPER" -c user.email="btc-flow@users.noreply.github.com" commit -m "Select three funded, active BTC PAPER whales"
          git pull --rebase origin main
          git push origin HEAD:main

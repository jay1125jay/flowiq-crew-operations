name: race-sports-historical-backfill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/race-sports-historical-backfill.yml'
      - 'race-sports/tools/historical_backfill.py'
      - 'race-sports/tools/historical_backfill_runner.py'
      - 'race-sports/tools/validate_horse_model.py'
  workflow_dispatch:
  schedule:
    - cron: '17 5,11,17,23 * * *'

permissions:
  contents: write

concurrency:
  group: race-sports-historical-backfill
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Self-test backfill parser
        run: python race-sports/tools/historical_backfill.py --self-test

      - name: Collect official historical data within daily quotas
        run: python race-sports/tools/historical_backfill_runner.py --horse-slice 625 --ksports-slice 625 --bull-slice 1125 --max-seconds 1500

      - name: Walk-forward validate Horse model
        run: python race-sports/tools/validate_horse_model.py

      - name: Commit checkpoints data and model validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "race-sports-backfill-bot"
          git config user.email "actions@users.noreply.github.com"
          git add race-sports/data/historical_state race-sports/data/backfill race-sports/models/horse_empirical_bayes_v0.2.validation.json
          if git diff --cached --quiet; then
            echo "No backfill change"
            exit 0
          fi
          git commit -m "chore: advance official race sports historical backfill"
          for n in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflict; rebasing attempt $n"
            git pull --rebase origin main
          done
          git push origin HEAD:main

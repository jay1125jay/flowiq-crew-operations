name: race-sports-historical-backfill
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/race-sports-historical-backfill.yml'
      - 'race-sports/tools/historical_backfill.py'
      - 'race-sports/tools/historical_backfill_hardening.py'
      - 'race-sports/tools/historical_cycle_result_fallback.py'
      - 'race-sports/tools/historical_backfill_runner.py'
      - 'race-sports/tools/backfill_quality_guard.py'
      - 'race-sports/tools/validate_horse_model.py'
      - 'race-sports/tools/validate_cycle_boat_models.py'
  schedule:
    # 07:00 KST every day (= 22:00 UTC on the previous calendar date).
    # One run starts the chain; self-dispatch continues until caps or 23:00 KST.
    - cron: '0 22 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: race-sports-historical-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check KST collection window
        id: window
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timedelta, timezone
          KST=timezone(timedelta(hours=9))
          now=datetime.now(KST)
          allowed = 7 <= now.hour < 23
          print(f"allowed={'1' if allowed else '0'}")
          print(f"kst_now={now.isoformat(timespec='seconds')}")
          print(f"BACKFILL_WINDOW={'OPEN' if allowed else 'CLOSED'}")
          PY

      - name: Self tests
        run: |
          python race-sports/tools/historical_backfill.py --self-test
          python race-sports/tools/historical_backfill_hardening.py --self-test
          python race-sports/tools/historical_cycle_result_fallback.py --self-test

      - name: Quality gate before collection
        run: python race-sports/tools/backfill_quality_guard.py

      - name: Consume daily quota
        if: steps.window.outputs.allowed == '1'
        shell: bash
        run: |
          MAX_SECONDS=$(python - <<'PY'
          from datetime import datetime, timedelta, timezone
          KST=timezone(timedelta(hours=9))
          now=datetime.now(KST)
          stop=now.replace(hour=23,minute=0,second=0,microsecond=0)
          remain=max(60,int((stop-now).total_seconds())-240)
          print(min(3300,remain))
          PY
          )
          echo "BACKFILL_MAX_SECONDS=$MAX_SECONDS"
          python race-sports/tools/historical_backfill_runner.py \
            --horse-slice 2500 \
            --ksports-slice 2500 \
            --bull-slice 4500 \
            --max-seconds "$MAX_SECONDS"

      - name: Quality gate after collection
        if: steps.window.outputs.allowed == '1'
        run: python race-sports/tools/backfill_quality_guard.py

      - name: Validate horse model
        if: steps.window.outputs.allowed == '1'
        run: python race-sports/tools/validate_horse_model.py

      - name: Validate cycle and boat own models
        if: steps.window.outputs.allowed == '1'
        run: python race-sports/tools/validate_cycle_boat_models.py

      - name: Publish backfill state conflict-safe
        if: steps.window.outputs.allowed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "race-sports-backfill-bot"
          git config user.email "actions@users.noreply.github.com"

          tar -czf /tmp/race-sports-backfill-output.tgz \
            race-sports/data/historical_state \
            race-sports/data/backfill \
            race-sports/models/horse_empirical_bayes_v0.2.validation.json \
            race-sports/models/cycle_empirical_bayes_v0.2.validation.json \
            race-sports/models/boat_empirical_bayes_v0.2.validation.json

          for n in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            tar -xzf /tmp/race-sports-backfill-output.tgz

            git add race-sports/data/historical_state
            git add race-sports/data/backfill
            git add race-sports/models/horse_empirical_bayes_v0.2.validation.json
            git add race-sports/models/cycle_empirical_bayes_v0.2.validation.json
            git add race-sports/models/boat_empirical_bayes_v0.2.validation.json

            if git diff --cached --quiet; then
              echo "No backfill change"
              exit 0
            fi

            git commit -m "chore: advance official race sports historical backfill"
            if git push origin HEAD:main; then
              echo "BACKFILL_PUBLISH=PASS"
              exit 0
            fi
            echo "Push conflict; replaying generated output ($n/5)"
          done

          echo "BACKFILL_PUBLISH=FAIL"
          exit 1

      - name: Dispatch live refresh after backfill
        if: steps.window.outputs.allowed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run race-sports-static-refresh.yml --ref main

      - name: Continue until daily caps are exhausted
        if: steps.window.outputs.allowed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/backfill_continue.env
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          KST=timezone(timedelta(hours=9))
          p=Path("race-sports/data/historical_state/backfill_report.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          caps=r.get("caps", {})
          used=r.get("usage_today", {})
          before=r.get("usage_before_run", {})

          remaining={
              "horse": max(0, int(caps.get("horse",0))-int(used.get("horse",0))),
              "ksports": max(0, int(caps.get("ksports",0))-int(used.get("ksports",0))),
              "bull": max(0, int(caps.get("bull",0))-int(used.get("bull",0))),
          }
          progress=sum(max(0,int(used.get(k,0))-int(before.get(k,0))) for k in remaining)
          now=datetime.now(KST)
          stop=now.replace(hour=23,minute=0,second=0,microsecond=0)
          seconds_left=(stop-now).total_seconds()
          in_window = 7 <= now.hour < 23

          should_continue=in_window and any(v>0 for v in remaining.values()) and progress>0 and seconds_left>600
          print(f"CONTINUE={'1' if should_continue else '0'}")
          print("REMAINING_HORSE="+str(remaining["horse"]))
          print("REMAINING_KSPORTS="+str(remaining["ksports"]))
          print("REMAINING_BULL="+str(remaining["bull"]))
          print("PROGRESS_CALLS="+str(progress))
          PY

          cat /tmp/backfill_continue.env
          source /tmp/backfill_continue.env

          if [ "$CONTINUE" = "1" ]; then
            echo "BACKFILL_SELF_DISPATCH=YES"
            gh workflow run race-sports-historical-backfill.yml --ref main
          else
            echo "BACKFILL_SELF_DISPATCH=NO"
          fi

name: ETH whale screening tests
on:
  push:
    branches:
      - feature/eth-whale-screening-standalone
    paths:
      - 'btc-flow-monitor/eth_whale_discovery_v2.py'
      - 'btc-flow-monitor/test_eth_whale_discovery_v2.py'
      - '.github/workflows/eth-whale-screening-test.yml'
  pull_request:
    paths:
      - 'btc-flow-monitor/eth_whale_discovery_v2.py'
      - 'btc-flow-monitor/test_eth_whale_discovery_v2.py'
      - '.github/workflows/eth-whale-screening-test.yml'
permissions:
  contents: read
  actions: read
jobs:
  eth-screening-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile btc-flow-monitor/eth_whale_discovery_v2.py btc-flow-monitor/test_eth_whale_discovery_v2.py
      - name: Unit tests
        working-directory: btc-flow-monitor
        run: python -m unittest -v test_eth_whale_discovery_v2.py
      - name: Discover and screen live ETH candidates
        working-directory: btc-flow-monitor
        run: python eth_whale_discovery_v2.py
      - name: Upload ETH candidate screening report
        uses: actions/upload-artifact@v4
        with:
          name: eth-whale-screening-report
          path: btc-flow-monitor/trader-discovery/eth-candidates.json
          if-no-files-found: error
          retention-days: 14

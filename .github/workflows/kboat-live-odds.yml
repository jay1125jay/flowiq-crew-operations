name: kboat-live-odds

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kboat-live-odds.yml'
      - 'race-sports/tools/kboat_live_odds.py'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: kboat-live-odds
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture latest official KBOAT odds on newest snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "race-sports-odds-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python race-sports/tools/kboat_live_odds.py
            git add race-sports/data/today.json

            if git diff --cached --quiet; then
              echo "No odds state change"
              exit 0
            fi

            git commit -m "chore: capture KBOAT live odds"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced another updater; retrying on latest main ($attempt/3)"
            sleep 2
          done
          exit 1

name: kboat-final-probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kboat-final-probe.yml'
      - 'race-sports/tools/kboat_final_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python race-sports/tools/kboat_final_probe.py

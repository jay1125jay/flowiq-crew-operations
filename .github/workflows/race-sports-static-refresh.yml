name: race-sports-static-refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/race-sports-static-refresh.yml'
      - 'race-sports/live.html'
      - 'race-sports/models/**'
      - 'race-sports/tools/racing_static_collector.py'
      - 'race-sports/tools/kboat_live_odds.py'
      - 'race-sports/tools/inject_kboat_ai.py'
      - 'race-sports/tools/kcycle_official_enricher.py'
      - 'race-sports/tools/kra_official_enricher.py'
      - 'race-sports/tools/bull_card_features.py'
      - 'race-sports/tools/inject_bull_model.py'
      - 'race-sports/tools/ui_multisport_patch.py'
      - 'race-sports/tools/snapshot_guard.py'
      - 'race-sports/tools/validate_snapshot.py'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: race-sports-static-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply multisport UI adapters
        run: python race-sports/tools/ui_multisport_patch.py

      - name: Validate UI JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('race-sports/live.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s,re.I)
          if not m: raise SystemExit('LIVE_SCRIPT_NOT_FOUND')
          Path('/tmp/race-sports-live.js').write_text(m.group(1),encoding='utf-8')
          for token in ['data-view="TODAY"','data-view="VALUE"','data-view="ANALYSIS"','data-view="SETTINGS"','STALE_LAST_KNOWN_GOOD','setInterval(load,10000)','KCYCLE_FINAL_SINGLE_AUTO','KCYCLE_AI_OFFICIAL']:
              if token not in s: raise SystemExit('UI_TOKEN_MISSING:'+token)
          PY
          node --check /tmp/race-sports-live.js

      - name: Exercise last-known-good recovery
        shell: bash
        run: |
          cp race-sports/data/today.json /tmp/guard-prev.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/guard-prev.json').read_text(encoding='utf-8'))
          if p.get('events'):
              p['events']=[]
              p['providers']=[]
          Path('/tmp/guard-current.json').write_text(json.dumps(p,ensure_ascii=False),encoding='utf-8')
          PY
          python race-sports/tools/snapshot_guard.py /tmp/guard-current.json /tmp/guard-prev.json
          python - <<'PY'
          import json
          from pathlib import Path
          prev=json.loads(Path('/tmp/guard-prev.json').read_text(encoding='utf-8'))
          cur=json.loads(Path('/tmp/guard-current.json').read_text(encoding='utf-8'))
          if prev.get('events'):
              assert len(cur.get('events',[]))==len(prev.get('events',[])), (len(cur.get('events',[])),len(prev.get('events',[])))
              assert all(e.get('stale') for e in cur.get('events',[]))
          print('SNAPSHOT_GUARD_TEST=PASS')
          PY

      - name: Test CPC bull feature parser on known historical card
        if: github.event_name == 'push'
        run: python race-sports/tools/bull_card_features.py --self-test-url 'https://www.cpc.or.kr/cpc/module/game/gameCard/confirmed/index.do?menu_idx=52&searchDayOrd=2&searchStndYear=2026&searchTms=29'

      - name: Preserve previous same-day snapshot
        shell: bash
        run: |
          if [ -f race-sports/data/today.json ]; then
            cp race-sports/data/today.json /tmp/race-sports-prev.json
          fi

      - name: Collect official 4-sport racing data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('race-sports/tools/racing_static_collector.py')
          s=p.read_text(encoding='utf-8')
          old='if -35<=delta<=120 and not r:'
          if old in s:
              s=s.replace(old,'if False and -35<=delta<=120 and not r:',1)
              p.write_text(s,encoding='utf-8')
          PY
          python race-sports/tools/racing_static_collector.py

      - name: Recover last-known-good events on provider failure
        run: python race-sports/tools/snapshot_guard.py race-sports/data/today.json /tmp/race-sports-prev.json

      - name: Enrich official KCYCLE AI odds and results
        shell: bash
        run: |
          if ! python race-sports/tools/kcycle_official_enricher.py; then
            echo 'KCYCLE enrichment unavailable this cycle; fail-safe snapshot remains publishable'
          fi

      - name: Enrich official KRA runners and results
        shell: bash
        run: |
          if ! python race-sports/tools/kra_official_enricher.py; then
            echo 'KRA enrichment unavailable this cycle; fail-safe snapshot remains publishable'
          fi

      - name: Enrich bull confirmed-card features
        shell: bash
        run: |
          if ! python race-sports/tools/bull_card_features.py; then
            echo 'CPC bull feature source unavailable this cycle; keeping last-known-good event data'
          fi

      - name: Capture current official KBOAT pre-race odds
        run: python race-sports/tools/kboat_live_odds.py

      - name: Inject official KBOAT AI probabilities
        shell: bash
        run: |
          ok=0
          for n in 1 2 3; do
            if python race-sports/tools/inject_kboat_ai.py; then
              ok=1
              break
            fi
            echo "KBOAT AI attempt $n failed; retrying"
            sleep 3
          done
          if [ "$ok" -ne 1 ]; then
            echo "KBOAT AI unavailable this cycle; preserving last-known-good model fields"
          fi

      - name: Inject validated bull three-class model when portable artifact is ready
        run: python race-sports/tools/inject_bull_model.py

      - name: Validate publish snapshot
        run: python race-sports/tools/validate_snapshot.py race-sports/data/today.json

      - name: Prepare current historical and UI snapshots
        shell: bash
        run: |
          set -euo pipefail
          cp race-sports/data/today.json /tmp/race-sports-today.json
          cp race-sports/live.html /tmp/race-sports-live.html
          DATE=$(python - <<'PY'
          import json
          print(json.load(open('race-sports/data/today.json',encoding='utf-8'))['date'])
          PY
          )
          mkdir -p /tmp/race-sports-history
          cp race-sports/data/today.json "/tmp/race-sports-history/${DATE}.json"
          echo "$DATE" > /tmp/race-sports-date.txt

      - name: Publish static snapshot without rebase conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "race-sports-bot"
          git config user.email "actions@users.noreply.github.com"
          DATE=$(cat /tmp/race-sports-date.txt)
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/race-sports-today.json race-sports/data/today.json
          cp /tmp/race-sports-live.html race-sports/live.html
          mkdir -p race-sports/data/history
          cp "/tmp/race-sports-history/${DATE}.json" "race-sports/data/history/${DATE}.json"
          git add race-sports/data/today.json race-sports/live.html "race-sports/data/history/${DATE}.json"
          if git diff --cached --quiet; then
            echo "No data change"
            exit 0
          fi
          git commit -m "chore: refresh race sports static snapshot"
          git push origin HEAD:main

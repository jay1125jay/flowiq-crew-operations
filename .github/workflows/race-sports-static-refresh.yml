name: race-sports-static-refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/race-sports-static-refresh.yml'
      - 'race-sports/live.html'
      - 'race-sports/models/**'
      - 'race-sports/data/backfill/**'
      - 'race-sports/data/historical_state/**'
      - 'race-sports/tools/racing_static_collector.py'
      - 'race-sports/tools/kboat_live_odds.py'
      - 'race-sports/tools/inject_kboat_ai.py'
      - 'race-sports/tools/inject_horse_model.py'
      - 'race-sports/tools/horse_ui_safety_patch.py'
      - 'race-sports/tools/inject_cycle_boat_own_models.py'
      - 'race-sports/tools/cycle_boat_own_ai_ui_patch.py'
      - 'race-sports/tools/cycle_model_distribution_guard.py'
      - 'race-sports/tools/kcycle_official_enricher.py'
      - 'race-sports/tools/kra_official_enricher.py'
      - 'race-sports/tools/kra_odds_endpoint_guard.py'
      - 'race-sports/tools/bull_model_features_v130.py'
      - 'race-sports/tools/bull_official_enricher.py'
      - 'race-sports/tools/bull_contract_guard.py'
      - 'race-sports/tools/inject_bull_model.py'
      - 'race-sports/tools/backfill_quality_guard.py'
      - 'race-sports/tools/ui_multisport_patch.py'
      - 'race-sports/tools/snapshot_guard.py'
      - 'race-sports/tools/validate_snapshot.py'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: race-sports-static-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply multisport UI adapters
        shell: bash
        run: |
          if ! python race-sports/tools/ui_multisport_patch.py; then
            echo 'Legacy UI patch sources already applied; continuing with current safety patches'
          fi
          python race-sports/tools/horse_ui_safety_patch.py
          python race-sports/tools/cycle_boat_own_ai_ui_patch.py

      - name: Validate UI JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('race-sports/live.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s,re.I)
          if not m: raise SystemExit('LIVE_SCRIPT_NOT_FOUND')
          Path('/tmp/race-sports-live.js').write_text(m.group(1),encoding='utf-8')
          for token in [
              'data-view="TODAY"','data-view="VALUE"','data-view="ANALYSIS"','data-view="SETTINGS"',
              'STALE_LAST_KNOWN_GOOD','setInterval(load,10000)',
              'KCYCLE_FINAL_SINGLE_AUTO','KCYCLE_AI_OFFICIAL','CPC_FINAL_SINGLE_AUTO','소싸움 3분류 모델',
              'valueModelReady(e)','경마 AI MVP','CYCLE_OWN_MODEL','BOAT_OWN_MODEL'
          ]:
              if token not in s: raise SystemExit('UI_TOKEN_MISSING:'+token)
          PY
          node --check /tmp/race-sports-live.js

      - name: Exercise last-known-good recovery
        shell: bash
        run: |
          cp race-sports/data/today.json /tmp/guard-prev.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/guard-prev.json').read_text(encoding='utf-8'))
          if p.get('events'):
              p['events']=[]
              p['providers']=[]
          Path('/tmp/guard-current.json').write_text(json.dumps(p,ensure_ascii=False),encoding='utf-8')
          PY
          python race-sports/tools/snapshot_guard.py /tmp/guard-current.json /tmp/guard-prev.json
          python - <<'PY'
          import json
          from pathlib import Path
          prev=json.loads(Path('/tmp/guard-prev.json').read_text(encoding='utf-8'))
          cur=json.loads(Path('/tmp/guard-current.json').read_text(encoding='utf-8'))
          if prev.get('events'):
              assert len(cur.get('events',[]))==len(prev.get('events',[])), (len(cur.get('events',[])),len(prev.get('events',[])))
              assert all(e.get('stale') for e in cur.get('events',[]))
          print('SNAPSHOT_GUARD_TEST=PASS')
          PY

      - name: Test CPC v1.3 bull feature adapter
        if: github.event_name == 'push'
        run: python race-sports/tools/bull_model_features_v130.py --self-test-url 'https://www.cpc.or.kr/cpc/module/game/gameCard/confirmed/index.do?menu_idx=52&searchDayOrd=2&searchStndYear=2026&searchTms=29'

      - name: Test validated Bull v1.3 portable scoring
        if: github.event_name == 'push'
        run: python race-sports/tools/inject_bull_model.py --self-test-url 'https://www.cpc.or.kr/cpc/module/game/gameCard/confirmed/index.do?menu_idx=52&searchDayOrd=2&searchStndYear=2026&searchTms=29'

      - name: Test CPC official bull odds and results
        if: github.event_name == 'push'
        run: python race-sports/tools/bull_official_enricher.py --self-test

      - name: Guard Bull official odds and final retention contract
        if: github.event_name == 'push'
        run: python race-sports/tools/bull_contract_guard.py

      - name: Guard KRA odds endpoints
        if: github.event_name == 'push'
        run: python race-sports/tools/kra_odds_endpoint_guard.py

      - name: Test KCYCLE official parser safety
        if: github.event_name == 'push'
        run: python race-sports/tools/kcycle_official_enricher.py --self-test

      - name: Test KRA official final runner odds parser
        if: github.event_name == 'push'
        run: python race-sports/tools/kra_official_enricher.py --self-test

      - name: Test Horse probability engine
        if: github.event_name == 'push'
        run: python race-sports/tools/inject_horse_model.py --self-test

      - name: Test Cycle and Boat own probability engines
        if: github.event_name == 'push'
        run: python race-sports/tools/inject_cycle_boat_own_models.py --self-test

      - name: Preserve previous same-day snapshot
        shell: bash
        run: |
          if [ -f race-sports/data/today.json ]; then
            cp race-sports/data/today.json /tmp/race-sports-prev.json
          fi

      - name: Collect official 4-sport racing data
        run: python race-sports/tools/racing_static_collector.py

      - name: Recover last-known-good events on provider failure
        run: python race-sports/tools/snapshot_guard.py race-sports/data/today.json /tmp/race-sports-prev.json

      - name: Enrich official KCYCLE AI odds and results
        shell: bash
        run: |
          if ! python race-sports/tools/kcycle_official_enricher.py; then
            echo 'KCYCLE enrichment unavailable this cycle; fail-safe snapshot remains publishable'
          fi

      - name: Guard incomplete KCYCLE distributions
        run: python race-sports/tools/cycle_model_distribution_guard.py

      - name: Enrich official KRA runners pre-race odds and results
        env:
          KRA_API_KEY: ${{ secrets.KRA_API_KEY }}
        shell: bash
        run: |
          if ! python race-sports/tools/kra_official_enricher.py; then
            echo 'KRA enrichment unavailable this cycle; fail-safe snapshot remains publishable'
          fi

      - name: Inject Horse probabilities
        shell: bash
        run: |
          if ! python race-sports/tools/inject_horse_model.py; then
            echo 'Horse probability engine unavailable this cycle; keeping official KRA card publishable'
          fi

      - name: Build current Bull v1.3 model features
        shell: bash
        run: |
          if ! python race-sports/tools/bull_model_features_v130.py; then
            echo 'CPC bull feature source unavailable this cycle; keeping last-known-good event data'
          fi

      - name: Enrich official Bull odds and results
        shell: bash
        run: |
          if ! python race-sports/tools/bull_official_enricher.py; then
            echo 'CPC bull odds/results unavailable this cycle; keeping card and prior snapshot'
          fi

      - name: Capture current official KBOAT pre-race odds
        run: python race-sports/tools/kboat_live_odds.py

      - name: Inject official KBOAT AI probabilities
        shell: bash
        run: |
          ok=0
          for n in 1 2 3; do
            if python race-sports/tools/inject_kboat_ai.py; then
              ok=1
              break
            fi
            echo "KBOAT AI attempt $n failed; retrying"
            sleep 3
          done
          if [ "$ok" -ne 1 ]; then
            echo "KBOAT AI unavailable this cycle; preserving last-known-good model fields"
          fi

      - name: Inject Cycle and Boat own AI probabilities
        shell: bash
        run: |
          if ! python race-sports/tools/inject_cycle_boat_own_models.py; then
            echo 'Cycle/Boat own AI unavailable this cycle; official card remains publishable'
          fi

      - name: Inject validated Bull RED DRAW BLUE model
        run: python race-sports/tools/inject_bull_model.py

      - name: Validate publish snapshot
        run: python race-sports/tools/validate_snapshot.py race-sports/data/today.json

      - name: Prepare current historical and UI snapshots
        shell: bash
        run: |
          set -euo pipefail
          cp race-sports/data/today.json /tmp/race-sports-today.json
          cp race-sports/live.html /tmp/race-sports-live.html
          if [ -f race-sports/data/model_state/cycle_boat_own_predictions.json ]; then
            mkdir -p /tmp/race-sports-model-state
            cp race-sports/data/model_state/cycle_boat_own_predictions.json /tmp/race-sports-model-state/cycle_boat_own_predictions.json
          fi
          DATE=$(python - <<'PY'
          import json
          print(json.load(open('race-sports/data/today.json',encoding='utf-8'))['date'])
          PY
          )
          mkdir -p /tmp/race-sports-history
          cp race-sports/data/today.json "/tmp/race-sports-history/${DATE}.json"
          echo "$DATE" > /tmp/race-sports-date.txt

      - name: Publish static snapshot without rebase conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "race-sports-bot"
          git config user.email "actions@users.noreply.github.com"
          DATE=$(cat /tmp/race-sports-date.txt)
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/race-sports-today.json race-sports/data/today.json
          cp /tmp/race-sports-live.html race-sports/live.html
          mkdir -p race-sports/data/history
          cp "/tmp/race-sports-history/${DATE}.json" "race-sports/data/history/${DATE}.json"
          git add race-sports/data/today.json race-sports/live.html "race-sports/data/history/${DATE}.json"
          if [ -f /tmp/race-sports-model-state/cycle_boat_own_predictions.json ]; then
            mkdir -p race-sports/data/model_state
            cp /tmp/race-sports-model-state/cycle_boat_own_predictions.json race-sports/data/model_state/cycle_boat_own_predictions.json
            git add race-sports/data/model_state/cycle_boat_own_predictions.json
          fi
          if git diff --cached --quiet; then
            echo "No data change"
            exit 0
          fi
          git commit -m "chore: refresh race sports static snapshot"
          git push origin HEAD:main

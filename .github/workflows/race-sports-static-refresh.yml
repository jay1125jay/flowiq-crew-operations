name: race-sports-static-refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/race-sports-static-refresh.yml'
      - 'race-sports/tools/kboat_static_collector.py'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: race-sports-static-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official KBOAT data
        run: python race-sports/tools/kboat_static_collector.py
      - name: Commit static snapshot
        run: |
          git config user.name "race-sports-bot"
          git config user.email "actions@users.noreply.github.com"
          git add race-sports/data/today.json
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "chore: refresh race sports static snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

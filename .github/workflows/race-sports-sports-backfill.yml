name: race-sports-sports-backfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/race-sports-sports-backfill.yml'
      - 'race-sports/tools/sports_provider.py'
      - 'race-sports/tools/sports_history_backfill.py'
      - 'race-sports/tools/kovo_official_pdf_backfill.py'
      - 'race-sports/tools/inject_sports_model.py'
      - 'race-sports/tools/validate_sports_snapshot.py'
  schedule:
    # 07:15 KST daily (= 22:15 UTC previous calendar date)
    - cron: '15 22 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: race-sports-sports-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install KOVO PDF parser
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Self tests
        run: |
          python race-sports/tools/sports_provider.py --self-test
          python race-sports/tools/kovo_official_pdf_backfill.py --self-test
          python race-sports/tools/sports_history_backfill.py --self-test
          python race-sports/tools/inject_sports_model.py --self-test

      - name: Capture checkpoint before collection
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          p=Path('race-sports/data/historical_state/sports_backfill_state.json')
          if p.exists():
              try:s=json.loads(p.read_text(encoding='utf-8'))
              except Exception:s={}
          else:s={}
          print('SPORTS_CURSOR_BEFORE='+str(s.get('cursor_date') or '9999-12-31'))
          print('SPORTS_REVISION_BEFORE='+str(s.get('revision') or ''))
          print('SPORTS_TARGET_BEFORE='+str(s.get('target_start_date') or '2022-01-01'))
          PY

      - name: Seed official KOVO history
        run: python race-sports/tools/kovo_official_pdf_backfill.py --seasons 022,021,020,019,018,017,016,015,014 --max-game 260 --workers 6

      - name: Live provider probe
        if: github.event_name == 'push'
        run: python race-sports/tools/sports_provider.py --live-probe

      - name: Backfill recent sports history on push
        if: github.event_name == 'push'
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          if [[ "$HEAD_COMMIT_MESSAGE" == *"[full-sports-backfill]"* ]]; then
            echo "SPORTS_BACKFILL_MODE=FULL"
            python race-sports/tools/sports_history_backfill.py --max-days 300 --max-seconds 3000 --sleep-seconds 0.25
          else
            echo "SPORTS_BACKFILL_MODE=RECENT"
            python race-sports/tools/sports_history_backfill.py --max-days 30 --max-seconds 180 --sleep-seconds 0.25
          fi

      - name: Continue sports history backfill
        if: github.event_name != 'push'
        run: python race-sports/tools/sports_history_backfill.py --max-days 300 --max-seconds 3000 --sleep-seconds 0.25

      - name: Rebuild SPORTS model state
        shell: bash
        run: |
          if [ -f race-sports/data/sports_today.json ]; then
            python race-sports/tools/inject_sports_model.py
            python race-sports/tools/validate_sports_snapshot.py race-sports/data/sports_today.json
          fi

      - name: Pack generated SPORTS outputs
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/raceiq-sports-backfill.tgz \
            race-sports/data/sports_history \
            race-sports/data/historical_state/sports_backfill_state.json \
            race-sports/data/historical_state/kovo_pdf_backfill_state.json \
            race-sports/data/model_state/sports_elo_v0.2.validation.json

      - name: Publish SPORTS backfill conflict-safe and monotonic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "raceiq-sports-backfill-bot"
          git config user.email "actions@users.noreply.github.com"

          for n in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            # Preserve the newest checkpoint before replaying this run's output.
            cp race-sports/data/historical_state/sports_backfill_state.json /tmp/origin-sports-state.json 2>/dev/null || true
            tar -xzf /tmp/raceiq-sports-backfill.tgz

            # Checkpoint progress is monotonic, but target expansion is allowed.
            # A completed checkpoint for a shallower target must never block a
            # newer revision that intentionally extends history further back.
            python - <<'PY'
          import json
          from pathlib import Path

          current=Path('race-sports/data/historical_state/sports_backfill_state.json')
          origin=Path('/tmp/origin-sports-state.json')
          if not current.exists() or not origin.exists():
              raise SystemExit(0)

          candidate=json.loads(current.read_text(encoding='utf-8'))
          latest=json.loads(origin.read_text(encoding='utf-8'))

          def cursor(s):
              return str(s.get('cursor_date') or '9999-12-31')

          def target(s):
              explicit=s.get('target_start_date')
              if explicit:
                  return str(explicit)
              rev=str(s.get('revision') or '')
              if rev.startswith('SPORTS_BACKFILL_V3'):
                  return '2022-01-01'
              return '9999-12-31'

          ct,lt=target(candidate),target(latest)
          same_target=(ct==lt)

          if ct < lt:
              chosen=dict(candidate)
              reason='TARGET_EXPANDED'
          elif lt < ct:
              chosen=dict(latest)
              reason='BLOCKED_TARGET_REGRESSION'
          elif latest.get('complete') and not candidate.get('complete'):
              chosen=dict(latest)
              reason='LATEST_COMPLETE'
          elif cursor(latest) < cursor(candidate):
              chosen=dict(latest)
              reason='BLOCKED_CURSOR_REGRESSION'
          else:
              chosen=dict(candidate)
              reason='CANDIDATE_AT_LEAST_AS_DEEP'

          chosen['calls_total']=max(int(latest.get('calls_total',0)), int(candidate.get('calls_total',0)))
          chosen['days_saved']=max(int(latest.get('days_saved',0)), int(candidate.get('days_saved',0)))
          if same_target:
              chosen['complete']=bool(latest.get('complete',False) or candidate.get('complete',False))
          else:
              chosen['complete']=bool(chosen.get('complete',False))
          chosen['target_start_date']=target(chosen)
          chosen['revision']=chosen.get('revision') or candidate.get('revision') or latest.get('revision')
          current.write_text(json.dumps(chosen,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({
              'SPORTS_CHECKPOINT_GUARD':'PASS',
              'reason':reason,
              'origin_target':lt,
              'candidate_target':ct,
              'origin_cursor':cursor(latest),
              'candidate_cursor':cursor(candidate),
              'published_cursor':cursor(chosen),
              'complete':chosen['complete'],
              'days_saved':chosen['days_saved'],
              'calls_total':chosen['calls_total'],
          },ensure_ascii=False))
          PY

            git add race-sports/data/sports_history
            git add race-sports/data/historical_state/sports_backfill_state.json
            git add race-sports/data/historical_state/kovo_pdf_backfill_state.json
            git add race-sports/data/model_state/sports_elo_v0.2.validation.json

            if git diff --cached --quiet; then
              echo "No SPORTS backfill change"
              break
            fi

            git commit -m "chore: advance RACEIQ sports history backfill"
            if git push origin HEAD:main; then
              echo "SPORTS_BACKFILL_PUBLISH=PASS"
              break
            fi
            echo "Push conflict; replaying generated SPORTS output ($n/5)"
            if [ "$n" = "5" ]; then
              echo "SPORTS_BACKFILL_PUBLISH=FAIL"
              exit 1
            fi
          done

      - name: Continue deep backfill chain when progress remains
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY' > /tmp/sports-continue.env
          import json
          import os
          from pathlib import Path

          p=Path('race-sports/data/historical_state/sports_backfill_state.json')
          s=json.loads(p.read_text(encoding='utf-8'))
          before=os.environ.get('SPORTS_CURSOR_BEFORE','9999-12-31')
          after=str(s.get('cursor_date') or '9999-12-31')
          complete=bool(s.get('complete',False))
          target=str(s.get('target_start_date') or '2022-01-01')
          progressed=after < before
          should=(not complete) and progressed and after >= target
          print('SPORTS_CONTINUE='+('1' if should else '0'))
          print('SPORTS_CURSOR_AFTER='+after)
          print('SPORTS_TARGET='+target)
          print('SPORTS_COMPLETE='+('1' if complete else '0'))
          print('SPORTS_PROGRESSED='+('1' if progressed else '0'))
          PY
          cat /tmp/sports-continue.env
          source /tmp/sports-continue.env
          if [ "$SPORTS_CONTINUE" = "1" ]; then
            gh workflow run race-sports-sports-backfill.yml --ref main
          fi

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020617"><title>WEXA 출근기록</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020617;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{display:flex;justify-content:center}.app{width:100%;max-width:520px;padding:24px 16px 70px}.brand{font-size:28px;font-weight:950;color:#dbeafe}.sub{margin-top:6px;color:#94a3b8;font-size:13px;line-height:1.5}.card{margin-top:14px;padding:16px;border-radius:20px;background:#0f172a;border:1px solid rgba(148,163,184,.15)}.title{font-size:17px;font-weight:900}.info{margin-top:7px;color:#cbd5e1;font-size:13px;line-height:1.5}.ok{color:#86efac}.empty{margin-top:14px;padding:18px;border:1px dashed rgba(148,163,184,.25);border-radius:18px;color:#94a3b8;line-height:1.5}button{width:100%;min-height:50px;margin-top:12px;border:1px solid rgba(148,163,184,.24);border-radius:16px;background:linear-gradient(180deg,#334155,#1e293b);color:#fff;font-size:14px;font-weight:900}.row{display:flex;gap:8px}.row button{flex:1}.version{margin-top:14px;text-align:center;color:#64748b;font-size:11px}</style></head><body><div class="app"><div class="brand">WEXA 출근기록</div><div class="sub">업체는 본인 소유 현장의 출근기록만 확인할 수 있습니다. 권한 필터링은 Supabase RLS에서 적용됩니다.</div><div id="root"><div class="empty">출근기록을 불러오고 있습니다.</div></div><div class="row"><button onclick="location.href='./operations.html?v=511'">WEXA 홈</button><button onclick="load()">새로고침</button></div><div class="version">WEXA ATTENDANCE v1.0 · 2026-09-03</div></div><script>
const SUPABASE_URL='https://zhbzphvqiiijfjqnktlo.supabase.co';const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpoYnpwaHZxaWlpamZqcW5rdGxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDEwNTcsImV4cCI6MjA5NDYxNzA1N30.ufIPHJh2fzRLm5taos3yTz6pGlEHFKaSoYI2Ref3T5I';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const root=document.getElementById('root');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function dt(v){if(!v)return '-';try{return new Date(v).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})}catch(e){return String(v)}}async function load(){root.innerHTML='<div class="empty">출근기록을 불러오고 있습니다.</div>';const {data:u,error:ue}=await db.auth.getUser();const user=u?.user;const role=String(user?.app_metadata?.role||'');if(ue||!user){root.innerHTML='<div class="empty">업체 로그인이 필요합니다.</div>';return}if(!['business','personal'].includes(role)){root.innerHTML='<div class="empty">업체 계정만 이 화면을 사용할 수 있습니다.</div>';return}const {data:rows,error}=await db.from('attendance').select('id,job_id,worker_name,job_title,attendance_date,check_in_at,status,gps').order('check_in_at',{ascending:false}).limit(200);if(error){root.innerHTML='<div class="empty">출근기록 조회에 실패했습니다.</div>';return}if(!rows?.length){root.innerHTML='<div class="empty">현재 확인할 출근기록이 없습니다.</div>';return}root.innerHTML=rows.map(r=>`<div class="card"><div class="title">${esc(r.job_title||'근무 공고')}</div><div class="info ok">● ${esc(r.status||'출근확인')}</div><div class="info">👷 ${esc(r.worker_name||'근로자')}</div><div class="info">📅 ${esc(r.attendance_date||'-')}</div><div class="info">🕒 ${esc(dt(r.check_in_at))}</div><div class="info">📍 위치기록 ${esc(r.gps||'미제공')}</div></div>`).join('')}load();
</script></body></html>
